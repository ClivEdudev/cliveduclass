<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ClivEdu Live · Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400..800&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../lessons/live.css">
</head>
<body class="host">
<main id="app" class="screen"></main>
<canvas id="confetti" aria-hidden="true"></canvas>
<script src="../lessons/plan.js"></script>
<script src="../lessons/live-sets.js"></script>
<script src="../lessons/live-net.js"></script>
<script src="../lessons/live-ui.js"></script>
<script>
(() => {
"use strict";
const P = window.PLAN, UI = window.LiveUI, NET = window.LiveNet, $ = s => document.querySelector(s), esc = UI.esc;
if (!P.isTeacher()) { location.replace("../teacher/"); return; }
const app = $("#app");
const S = { phase: "setup", room: null, client: null, players: {}, order: [], qi: -1, q: null, qStart: 0, answers: {}, limit: 20, set: null, status: "offline", tick: 0, lastGain: {} };
const sets = window.LIVE_SETS.map(s => ({ ...s }));
sets.push({ id: "mix", title: "Mixed review", topic: "10 questions from every set", mix: true });

/* ---------- setup ---------- */
function setup() {
  S.phase = "setup";
  app.innerHTML = `<header class="hbar"><a class="brand" href="../teacher/"><i></i>ClivEdu Live</a><span class="muted">Host a class game</span></header>
    <section class="wrapc">
      <h1 class="big">Start a live game</h1>
      <p class="lead">Choose the questions. Teams join from one phone each, or students join on their own phones.</p>
      <div class="setgrid">${sets.map((s, i) => `<button class="setcard ${i === 0 ? "sel" : ""}" data-set="${s.id}"><span class="eb">${esc(s.topic)}</span><b>${esc(s.title)}</b><span class="muted">${s.mix ? "10 random" : s.qs.length + " questions"}</span></button>`).join("")}</div>
      <div class="row gap">
        <span class="muted strong">Time per question:</span>
        ${[10, 20, 30].map(t => `<button class="pill ${t === S.limit ? "sel" : ""}" data-time="${t}">${t} s</button>`).join("")}
      </div>
      <div class="row gap"><button class="btn y xl" data-create>Create game →</button><span class="muted" id="setupMsg"></span></div>
    </section>`;
  S.set = sets[0];
}
function pickQuestions() {
  let pool;
  if (S.set.mix) pool = UI.shuffle(sets.filter(s => !s.mix).flatMap(s => s.qs)).slice(0, 10);
  else pool = UI.shuffle(S.set.qs);
  return pool.map(q => { const opts = q.slice(1).map((t, i) => ({ t, ok: i === 0 })); const sh = UI.shuffle(opts); return { text: q[0], opts: sh.map(o => o.t), correct: sh.findIndex(o => o.ok) }; });
}
async function create() {
  $("#setupMsg").textContent = "Connecting to the live server…";
  $("[data-create]").disabled = true;
  try {
    const { client, index } = await NET.hostConnect(onMessage, st => { S.status = st; UI.status(st); });
    S.client = client; S.room = NET.makeRoom(index);
    client.subscribe(NET.topic(S.room, "join"));
    client.subscribe(NET.topic(S.room, "ans"));
    S.order = pickQuestions(); S.qi = -1; S.players = {};
    lobby();
  } catch (e) {
    $("#setupMsg").textContent = "Could not reach a live server. Check the internet connection and try again.";
    $("[data-create]").disabled = false;
  }
}

/* ---------- state sent to phones ---------- */
function publish() {
  if (!S.client) return;
  const players = Object.values(S.players).map(p => ({ id: p.id, name: p.name, type: p.type, score: p.score }));
  const st = { v: 1, phase: S.phase, set: S.set.title, qi: S.qi, total: S.order.length, limit: S.limit, players };
  if (S.phase === "question") { st.q = { text: S.q.text, opts: S.q.opts }; st.left = Math.max(0, S.limit - (Date.now() - S.qStart) / 1000); st.answered = Object.keys(S.answers); }
  if (S.phase === "reveal" || S.phase === "board") { st.q = { text: S.q.text, opts: S.q.opts }; st.correct = S.q.correct; st.gained = S.lastGain; st.chosen = Object.fromEntries(Object.entries(S.answers).map(([k, v]) => [k, v.choice])); }
  S.client.publish(NET.topic(S.room, "state"), st, true);
}
function onMessage(topic, payload) {
  let m; try { m = JSON.parse(payload); } catch (e) { return; }
  if (topic.endsWith("/join") && m.id && m.name) {
    const name = String(m.name).slice(0, 18), type = m.type === "team" ? "team" : "solo";
    if (!S.players[m.id]) { S.players[m.id] = { id: m.id, name, type, score: 0 }; UI.ding(); }
    else { S.players[m.id].name = name; S.players[m.id].type = type; }
    render(); publish();
  } else if (topic.endsWith("/ans") && m.id && S.phase === "question" && m.qi === S.qi && S.players[m.id] && !S.answers[m.id]) {
    S.answers[m.id] = { choice: +m.choice, t: (Date.now() - S.qStart) / 1000 };
    render(); publish();
    if (Object.keys(S.answers).length >= Object.keys(S.players).length) reveal();
  }
}

/* ---------- game flow ---------- */
function lobby() { S.phase = "lobby"; render(); publish(); }
function nextQuestion() {
  S.qi++;
  if (S.qi >= S.order.length) return finish();
  S.q = S.order[S.qi]; S.answers = {}; S.lastGain = {}; S.phase = "question"; S.qStart = Date.now();
  render(); publish();
  clearInterval(S.tick);
  S.tick = setInterval(() => {
    const left = S.limit - (Date.now() - S.qStart) / 1000;
    const el = $("#tleft"); if (el) el.textContent = Math.max(0, Math.ceil(left));
    const ring = $("#ring"); if (ring) ring.style.setProperty("--p", Math.max(0, left / S.limit));
    if (left <= 0) reveal();
  }, 250);
}
function reveal() {
  if (S.phase !== "question") return;
  clearInterval(S.tick);
  S.phase = "reveal";
  S.lastGain = {};
  for (const [id, a] of Object.entries(S.answers)) {
    if (a.choice === S.q.correct) { const pts = Math.round(1000 * (1 - Math.min(a.t, S.limit) / S.limit / 2)); S.lastGain[id] = pts; S.players[id].score += pts; }
    else S.lastGain[id] = 0;
  }
  render(); publish();
}
function board() { S.phase = "board"; render(); publish(); }
function finish() { clearInterval(S.tick); S.phase = "end"; render(); publish(); setTimeout(() => UI.confetti(innerWidth / 2, innerHeight / 3, 220), 300); }
function closeRoom() {
  clearInterval(S.tick);
  if (S.client) { S.client.publish(NET.topic(S.room, "state"), { v: 1, phase: "closed" }, true); setTimeout(() => { S.client.publish(NET.topic(S.room, "state"), "", true); S.client.close(); S.client = null; }, 400); }
  setup();
}
const ranked = () => Object.values(S.players).sort((a, b) => b.score - a.score);

/* ---------- screens ---------- */
function render() {
  if (S.phase === "setup") return;
  const top = `<header class="hbar"><span class="brand"><i></i>ClivEdu Live</span><span class="muted">${esc(S.set.title)}</span>
    <span class="code-sm">Code <b>${S.room}</b></span><span id="net" class="net ${S.status}">${S.status === "online" ? "Online" : "Reconnecting…"}</span>
    <button class="pill" data-close>End game</button></header>`;
  const n = Object.keys(S.players).length;
  let body = "";
  if (S.phase === "lobby") {
    body = `<section class="lobby">
      <div class="joinbox"><p class="muted strong">Go to</p><p class="url">cliveduclass.netlify.app/play</p><p class="muted strong">and enter the code</p><p class="bigcode">${S.room}</p>
        <p class="muted">One phone per team, or join on your own.</p></div>
      <div class="roster"><div class="row between"><h2>${n} joined</h2><button class="btn y xl" data-start ${n ? "" : "disabled"}>Start →</button></div>
        <div class="chips">${Object.values(S.players).map(p => `<span class="chip ${p.type}">${p.type === "team" ? "Team" : "Solo"} · ${esc(p.name)}<button class="x" data-kick="${p.id}" aria-label="Remove ${esc(p.name)}">×</button></span>`).join("") || `<p class="muted">Waiting for players…</p>`}</div></div>
    </section>`;
  } else if (S.phase === "question" || S.phase === "reveal") {
    const rev = S.phase === "reveal";
    const counts = [0, 0, 0, 0]; Object.values(S.answers).forEach(a => counts[a.choice]++);
    const max = Math.max(1, ...counts);
    const leftNow = Math.max(0, S.limit - (Date.now() - S.qStart) / 1000);
    body = `<section class="qscreen">
      <div class="row between"><span class="eb">Question ${S.qi + 1} of ${S.order.length}</span>
        ${rev ? "" : `<span class="ring" id="ring" style="--p:${(leftNow / S.limit).toFixed(3)}"><b id="tleft">${Math.ceil(leftNow)}</b></span>`}</div>
      <h1 class="qtext">${esc(S.q.text)}</h1>
      ${rev ? `<div class="bars">${counts.map((c, i) => `<div class="barc"><span class="bar o${i} ${i === S.q.correct ? "ok" : ""}" style="height:${18 + (c / max) * 82}%"><b>${c}</b></span>${UI.shape(i)}</div>`).join("")}</div>` : ""}
      <div class="opts">${S.q.opts.map((t, i) => `<div class="opt o${i} ${rev ? (i === S.q.correct ? "ok" : "dim") : ""}">${UI.shape(i)}<span>${esc(t)}</span>${rev && i === S.q.correct ? '<span class="tick">✓</span>' : ""}</div>`).join("")}</div>
      <div class="row between">
        <span class="muted strong">${rev ? `${Object.values(S.lastGain).filter(x => x > 0).length} of ${n} correct` : `Answers: ${Object.keys(S.answers).length} / ${n}`}</span>
        ${rev ? `<button class="btn y xl" data-board>Scores →</button>` : `<button class="btn" data-reveal>Show answer now</button>`}
      </div></section>`;
  } else if (S.phase === "board") {
    const r = ranked();
    body = `<section class="wrapc"><h1 class="big">Scores</h1>
      <div class="lboard">${r.slice(0, 6).map((p, k) => `<div class="lrow ${k === 0 ? "first" : ""}"><span class="pos">${k + 1}</span><span class="nm">${esc(p.name)} <small>${p.type === "team" ? "Team" : "Solo"}</small></span>${S.lastGain[p.id] ? `<span class="gain">+${S.lastGain[p.id]}</span>` : ""}<b>${p.score}</b></div>`).join("")}</div>
      <div class="row end"><button class="btn y xl" data-next>${S.qi + 1 >= S.order.length ? "Final results →" : "Next question →"}</button></div></section>`;
  } else if (S.phase === "end") {
    const r = ranked();
    const pod = [r[1], r[0], r[2]];
    body = `<section class="wrapc"><h1 class="big center">Winners!</h1>
      <div class="podium">${pod.map((p, k) => p ? `<div class="pod p${[2, 1, 3][k]}"><span class="pname">${esc(p.name)}</span><span class="pscore">${p.score}</span><div class="block">${[2, 1, 3][k]}</div></div>` : `<div class="pod empty"></div>`).join("")}</div>
      <div class="lboard compact">${r.slice(3).map((p, k) => `<div class="lrow"><span class="pos">${k + 4}</span><span class="nm">${esc(p.name)}</span><b>${p.score}</b></div>`).join("")}</div>
      <div class="row center gap"><button class="btn y xl" data-again>Play again</button><button class="btn" data-close>Close game</button></div></section>`;
  }
  app.innerHTML = top + body;
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.set) { S.set = sets.find(s => s.id === d.set); document.querySelectorAll(".setcard").forEach(b => b.classList.toggle("sel", b === t)); }
  else if (d.time) { S.limit = +d.time; document.querySelectorAll("[data-time]").forEach(b => b.classList.toggle("sel", b === t)); }
  else if (d.create != null) create();
  else if (d.start != null) nextQuestion();
  else if (d.reveal != null) reveal();
  else if (d.board != null) board();
  else if (d.next != null) nextQuestion();
  else if (d.kick) { delete S.players[d.kick]; render(); publish(); }
  else if (d.again != null) { Object.values(S.players).forEach(p => p.score = 0); S.order = pickQuestions(); S.qi = -1; lobby(); }
  else if (d.close != null) closeRoom();
});
addEventListener("beforeunload", () => { if (S.client && S.room) S.client.publish(NET.topic(S.room, "state"), { v: 1, phase: "closed" }, true); });
setup();
})();
</script>
</body>
</html>
