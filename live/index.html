<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ClivEdu Live · Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400..800&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../lessons/live.css">
</head>
<body class="host">
<main id="app" class="screen"></main>
<canvas id="confetti" aria-hidden="true"></canvas>
<script src="../lessons/plan.js"></script>
<script src="../lessons/live-sets.js"></script>
<script src="../lessons/live-net.js"></script>
<script src="../lessons/live-ui.js"></script>
<script>
(() => {
"use strict";
const P = window.PLAN, UI = window.LiveUI, NET = window.LiveNet, $ = s => document.querySelector(s), esc = UI.esc, shuffle = UI.shuffle;
if (!P.isTeacher()) { location.replace("../teacher/"); return; }
const app = $("#app");
const REVEAL_MS = 3000, BOARD_MS = 4000, ROUNDS = 30, BOARD_EVERY = 5;
const TYPES = [
  { id: "mix", name: "Mix of everything", desc: "All game types in one game" },
  { id: "mcq", name: "Quiz", desc: "Four answers, pick the right one" },
  { id: "tf", name: "Right or wrong?", desc: "Is the sentence correct?" },
  { id: "build", name: "Word order race", desc: "Tap the words in the right order" },
  { id: "clue", name: "Mystery clues", desc: "Guess from clues; earlier = more points" }
];
const TYPE_LABEL = { mcq: "Quiz", tf: "Right or wrong?", build: "Word order race", clue: "Mystery clues" };
/* One short instruction per question type, in English and Uzbek, on the board and on phones */
const HOW = {
  mcq: ["Tap the right answer.", "To\u2018g\u2018ri javobni bosing."],
  tf: ["Is the sentence right or wrong?", "Gap to\u2018g\u2018rimi yoki noto\u2018g\u2018ri?"],
  build: ["Tap the words in order, then Send.", "So\u2018zlarni tartib bilan bosing, keyin Yuborish."],
  clue: ["Read the clues. Guess early for more points.", "Ishoralarni o\u2018qing. Tez topsangiz \u2014 ko\u2018proq ball."]
};
/* A warm-up question so beginners learn how to play before points count */
const PRACTICE = { type: "mcq", practice: true, text: "Practice: which one is a colour? \u00b7 Mashq: qaysi biri rang?", opts: ["blue", "bread", "bus", "bed"], correct: 0 };
const withPractice = rounds => { const o = shuffle(PRACTICE.opts.map((t, i) => ({ t, ok: i === 0 }))); return [Object.assign({}, PRACTICE, { opts: o.map(x => x.t), correct: o.findIndex(x => x.ok) })].concat(rounds); };
const hasPractice = () => !!(S.rounds[0] && S.rounds[0].practice);
const qNum = () => S.qi + (hasPractice() ? 0 : 1);                 /* question number shown to people */
const qTotal = () => S.rounds.length - (hasPractice() ? 1 : 0);
const sets = window.LIVE_SETS.map(s => ({ ...s }));
sets.push({ id: "all", title: "Everything so far", topic: "Big Revision + lessons 1–5 + vocabulary", mixOf: sets.filter(s => !/^s\d/.test(s.id)).map(s => s.id) });
const S = { phase: "setup", room: null, client: null, players: {}, rounds: [], qi: -1, q: null, qStart: 0, answers: {}, limit: 15, qLimit: 15, seq: 0,
  set: sets[0], type: "mix", auto: true, status: "offline", tick: 0, timer: 0, autoAt: 0, lastGain: {}, clueShown: 1 };

/* ---------- content loading ---------- */
const lessonCache = {};
function loadLesson(path) {
  if (lessonCache[path]) return Promise.resolve(lessonCache[path]);
  return new Promise(res => {
    window.LESSON = undefined;
    const sc = document.createElement("script");
    sc.src = "../" + path;
    sc.onload = () => { lessonCache[path] = window.LESSON || null; res(lessonCache[path]); };
    sc.onerror = () => res(null);
    document.head.appendChild(sc);
  });
}
async function buildRounds() {
  const src = S.set.mixOf ? sets.filter(s => S.set.mixOf.includes(s.id) || s.id === S.set.id) : [S.set];
  const mcq = [], tf = [], build = [], clue = [];
  for (const s of src) {
    (s.qs || []).forEach(q => mcq.push(q));
    if (!s.path) continue;
    const L = await loadLesson(s.path);
    const g = L && L.games || {};
    (g.auction || []).forEach(a => tf.push(a));
    (g.build || []).forEach(b => build.push(b));
    if (g.mystery && g.mystery.items) g.mystery.items.forEach(it => clue.push({ it, sib: g.mystery.items, title: g.mystery.title || "Mystery" }));
  }
  const mk = {
    mcq: q => { const o = shuffle(q.slice(1).map((t, i) => ({ t, ok: i === 0 }))); return { type: "mcq", text: q[0], opts: o.map(x => x.t), correct: o.findIndex(x => x.ok) }; },
    tf: a => ({ type: "tf", text: a.s, opts: ["Right", "Wrong"], correct: a.ok ? 0 : 1, fix: a.fix || "" }),
    build: b => { const words = shuffle(b.w); return { type: "build", text: "Put the words in order", words, answer: b.w, end: b.e }; },
    clue: c => { const others = shuffle(c.sib.filter(x => x.p !== c.it.p)).slice(0, 3).map(x => x.p); const o = shuffle([{ t: c.it.p, ok: true }, ...others.map(t => ({ t, ok: false }))]);
      return { type: "clue", text: c.title, clues: c.it.c, opts: o.map(x => x.t), correct: o.findIndex(x => x.ok), uz: c.it.uz || "" }; }
  };
  const take = (arr, n, f) => shuffle(arr).slice(0, n).map(f);
  let rounds;
  if (S.type === "mix") {
    const A = { mcq: take(mcq, 99, mk.mcq), tf: take(tf, 99, mk.tf), build: take(build, 7, mk.build), clue: take(clue, 4, mk.clue) };
    const pat = ["mcq", "tf", "mcq", "build", "tf", "mcq", "clue", "mcq", "tf", "build"];
    rounds = [];
    for (let k = 0; rounds.length < ROUNDS && k < 400; k++) { const t = pat[k % pat.length]; if (A[t].length) rounds.push(A[t].shift()); else if (!A.mcq.length && !A.tf.length && !A.build.length && !A.clue.length) break; }
  } else {
    const pool = { mcq: mcq, tf: tf, build: build, clue: clue }[S.type];
    rounds = take(pool, ROUNDS, mk[S.type]);
  }
  return rounds;
}

/* ---------- setup ---------- */
function setup() {
  S.phase = "setup";
  app.innerHTML = `<header class="hbar"><a class="brand" href="../teacher/"><i></i>ClivEdu Live</a><span class="muted">Host a class game</span></header>
    <section class="wrapc">
      <h1 class="big">Start a live game</h1>
      <p class="lead">Teams join from one phone each, or students join on their own phones.</p>
      <h2 class="h3">1 · Which lessons?</h2>
      <div class="setgrid">${sets.map(s => `<button class="setcard ${s === S.set ? "sel" : ""}" data-set="${s.id}"><span class="eb">${esc(s.topic)}</span><b>${esc(s.title)}</b></button>`).join("")}</div>
      <h2 class="h3">2 · Which game?</h2>
      <div class="setgrid">${TYPES.map(t => `<button class="setcard ${t.id === S.type ? "sel" : ""}" data-type="${t.id}"><b>${esc(t.name)}</b><span class="muted">${esc(t.desc)}</span></button>`).join("")}</div>
      <h2 class="h3">3 · Settings</h2>
      <div class="row gap"><span class="muted strong">Time per question:</span>${[10, 15, 20].map(t => `<button class="pill ${t === S.limit ? "sel" : ""}" data-time="${t}">${t} s</button>`).join("")}</div>
      <div class="row gap"><span class="muted strong">Move on by itself:</span><button class="pill ${S.auto ? "sel" : ""}" data-auto="1">On</button><button class="pill ${S.auto ? "" : "sel"}" data-auto="0">Off</button>
        <span class="muted">Answer shown ${REVEAL_MS / 1000} s → next question. Scores every ${BOARD_EVERY} questions. You can pause any time.</span></div>
      <div class="row gap"><button class="btn y xl" data-create>Create game →</button><span class="muted" id="setupMsg"></span></div>
    </section>`;
  app.querySelector(".wrapc").insertAdjacentHTML("afterbegin", `<div class="running"><h2 class="h3">Games running now</h2><div id="rooms" class="roomlist"><p class="muted">Looking for games…</p></div></div>`);
  startWatch();
}
let stopWatch = null, roomList = [];
function startWatch() {
  if (!stopWatch) stopWatch = NET.watchRooms(list => { roomList = list; drawRooms(); });
  drawRooms();
}
function drawRooms() {
  const el = $("#rooms"); if (!el) return;
  const snap = readSnap();
  const list = roomList.slice();
  if (snap && !list.some(r => r.code === snap.room)) list.unshift({ code: snap.room, set: (sets.find(x => x.id === snap.setId) || {}).title || "", type: (TYPES.find(t => t.id === snap.type) || {}).name || "", phase: snap.phase, qi: snap.qi, total: snap.rounds.length, n: Object.keys(snap.players).length });
  el.innerHTML = list.length ? list.map(r => {
    const mine = snap && snap.room === r.code;
    return `<div class="roomcard"><span class="rcode">${esc(r.code)}</span><span class="rinfo"><b>${esc(r.set || "")}</b> · ${esc(r.type || "")}<br><span class="muted">${roomStatus(r)}</span></span>
      ${mine ? `<button class="btn y" data-resume="${esc(r.code)}">Continue</button>` : ""}<button class="pill" data-endroom="${esc(r.code)}">End</button></div>`;
  }).join("") : `<p class="muted">No games running. Create one below.</p>`;
}
function roomStatus(r) { return r.phase === "lobby" ? `Waiting to start · ${r.n || 0} joined` : r.phase === "end" ? "Finished" : `Question ${(r.qi || 0) + 1} of ${r.total || "?"} · ${r.n || 0} playing`; }
async function endRemote(code) {
  try {
    const c = await NET.join(code, () => {}, () => {});
    c.publish(NET.topic(code, "state"), { v: 2, phase: "closed" }, true);
    c.publish(NET.roomTopic(code), "", true);
    setTimeout(() => c.close(), 1800);
  } catch (e) {}
  const snap = readSnap(); if (snap && snap.room === code) dropSnap();
  roomList = roomList.filter(r => r.code !== code); drawRooms();
}
async function resume(code) {
  const snap = readSnap(); if (!snap || snap.room !== code) return;
  const msg = $("#setupMsg"); if (msg) msg.textContent = "Reconnecting to your game…";
  try {
    S.set = sets.find(x => x.id === snap.setId) || sets[0]; S.type = snap.type; S.limit = snap.limit; S.auto = snap.auto;
    S.rounds = snap.rounds; S.players = snap.players; S.room = snap.room; S.qi = snap.qi;
    S.client = await NET.join(code, onMessage, st => { S.status = st; UI.status(st); });
    S.status = "online";
    S.client.subscribe(NET.topic(S.room, "join")); S.client.subscribe(NET.topic(S.room, "ans"));
    if (stopWatch) { stopWatch(); stopWatch = null; }
    if (snap.phase === "lobby" || snap.qi < 0) lobby();
    else if (snap.phase === "question") { S.qi = snap.qi - 1; nextQuestion(); }
    else { S.q = S.rounds[S.qi]; S.lastGain = {}; board(); }
  } catch (e) { if (msg) msg.textContent = "Could not reconnect. Check the internet and try again."; }
}
async function create() {
  const msg = $("#setupMsg"); $("[data-create]").disabled = true;
  msg.textContent = "Preparing questions…";
  S.rounds = await buildRounds();
  if (S.rounds.length) S.rounds = withPractice(S.rounds);
  if (!S.rounds.length) { msg.textContent = "This lesson has no questions for that game. Choose another game."; $("[data-create]").disabled = false; return; }
  msg.textContent = "Connecting to the live server…";
  try {
    const { client, index } = await NET.hostConnect(onMessage, st => { S.status = st; UI.status(st); });
    S.client = client; S.room = NET.makeRoom(index);
    if (stopWatch) { stopWatch(); stopWatch = null; }
    client.subscribe(NET.topic(S.room, "join")); client.subscribe(NET.topic(S.room, "ans"));
    S.qi = -1; S.players = {};
    lobby();
  } catch (e) { msg.textContent = "Could not reach a live server. Check the internet connection and try again."; $("[data-create]").disabled = false; }
}

/* ---------- state for phones (small messages) ---------- */
function publish() {
  if (!S.client) return;
  const st = { v: 3, phase: S.phase, qi: S.qi, total: S.rounds.length, num: qNum(), of: qTotal(), k: Date.now() * 100 + (S.seq++ % 100) };
  if (S.q && S.q.practice && S.phase !== "lobby" && S.phase !== "end") st.practice = true;
  if (S.phase === "lobby" || S.phase === "board" || S.phase === "end" || S.phase === "reveal") st.players = Object.values(S.players).map(p => [p.id, p.score]);
  if (S.phase === "lobby") st.n = Object.keys(S.players).length;
  if (S.phase === "question" || S.phase === "reveal") {
    const q = S.q;
    st.q = { type: q.type, text: q.text, how: HOW[q.type] };
    if (q.opts) st.q.opts = q.opts;
    if (q.type === "build") { st.q.words = q.words; st.q.end = q.end; }
    if (q.type === "clue") st.q.clue = q.clues[Math.min(S.clueShown, q.clues.length) - 1];
  }
  if (S.phase === "question") { st.left = Math.max(0, S.qLimit - (Date.now() - S.qStart) / 1000); st.answered = Object.keys(S.answers); }
  if (S.phase === "reveal") { st.correct = S.q.correct; st.answerText = answerText(S.q); st.gained = S.lastGain; }
  S.client.publish(NET.topic(S.room, "state"), st, true);
  S.lastPub = Date.now();
  announce(); saveSnap();
}
let lastAnn = "", annAt = 0;
function announce(force) {
  if (!S.client || !S.room) return;
  const e = { code: S.room, set: S.set.title, type: TYPES.find(t => t.id === S.type).name, phase: S.phase, qi: S.qi, total: S.rounds.length, n: Object.keys(S.players).length };
  const sig = JSON.stringify(e);
  if (!force && sig === lastAnn && Date.now() - annAt < 30000) return;
  lastAnn = sig; annAt = Date.now(); e.ts = annAt;
  S.client.publish(NET.roomTopic(S.room), e, true);
}
setInterval(() => announce(true), 30000);
function saveSnap() {
  try { localStorage.setItem("clv-live-host", JSON.stringify({ room: S.room, setId: S.set.id, type: S.type, limit: S.limit, auto: S.auto, rounds: S.rounds, qi: S.qi, phase: S.phase, players: S.players, savedAt: Date.now() })); } catch (e) {}
}
function readSnap() { try { const x = JSON.parse(localStorage.getItem("clv-live-host") || "null"); return x && Date.now() - x.savedAt < 6 * 3600000 && x.phase !== "end" ? x : null; } catch (e) { return null; } }
function dropSnap() { try { localStorage.removeItem("clv-live-host"); } catch (e) {} }
function answerText(q) { return q.type === "build" ? q.answer.join(" ") + q.end : q.type === "tf" ? (q.correct === 0 ? "Right" : "Wrong — " + q.fix) : q.opts[q.correct]; }
function onMessage(topic, payload) {
  let m; try { m = JSON.parse(payload); } catch (e) { return; }
  if (topic.endsWith("/join") && m.id && m.name) {
    const name = String(m.name).slice(0, 18), type = m.type === "team" ? "team" : "solo";
    const isNew = !S.players[m.id];
    if (isNew) { S.players[m.id] = { id: m.id, name, type, score: 0 }; UI.ding(); } else { S.players[m.id].name = name; S.players[m.id].type = type; }
    if (S.phase === "lobby") renderLobbyList(); else if (isNew) render();
    publish();
  } else if (topic.endsWith("/ans") && m.id && S.phase === "question" && m.qi === S.qi && S.players[m.id] && !S.answers[m.id]) {
    S.answers[m.id] = { choice: m.choice != null ? +m.choice : null, order: Array.isArray(m.order) ? m.order : null, t: (Date.now() - S.qStart) / 1000 };
    const c = $("#ansCount"); if (c) c.textContent = `Answers: ${Object.keys(S.answers).length} / ${Object.keys(S.players).length}`;
    publish();
    if (Object.keys(S.answers).length >= Object.keys(S.players).length) reveal();
  }
}

/* ---------- game flow ---------- */
function lobby() { S.phase = "lobby"; render(); publish(); }
function clearTimers() { clearInterval(S.tick); clearTimeout(S.timer); S.autoAt = 0; }
function nextQuestion() {
  clearTimers();
  S.qi++;
  if (S.qi >= S.rounds.length) return finish();
  S.q = S.rounds[S.qi]; S.answers = {}; S.lastGain = {}; S.phase = "question"; S.clueShown = 1;
  S.qLimit = S.q.type === "build" ? S.limit + 10 : S.q.type === "clue" ? Math.max(30, S.limit * 1.5) : S.limit;
  S.qStart = Date.now();
  render(); publish();
  S.tick = setInterval(() => {
    const el = (Date.now() - S.qStart) / 1000, left = S.qLimit - el;
    const t = $("#tleft"); if (t) t.textContent = Math.max(0, Math.ceil(left));
    const ring = $("#ring"); if (ring) ring.style.setProperty("--p", Math.max(0, left / S.qLimit).toFixed(3));
    if (S.q.type === "clue") { const want = Math.min(S.q.clues.length, 1 + Math.floor(el / (S.qLimit / S.q.clues.length))); if (want !== S.clueShown) { S.clueShown = want; render(); publish(); } }
    if (left <= 0) reveal();
    if (Date.now() - (S.lastPub || 0) > 4000) publish();
  }, 250);
}
function isCorrect(q, a) {
  if (q.type === "build") return Array.isArray(a.order) && a.order.length === q.answer.length && a.order.every((k, i) => q.words[k] === q.answer[i]);
  return a.choice === q.correct;
}
function reveal() {
  if (S.phase !== "question") return;
  clearTimers();
  S.phase = "reveal"; S.lastGain = {};
  for (const [id, a] of Object.entries(S.answers)) {
    if (!S.players[id]) continue;
    if (isCorrect(S.q, a)) { const pts = S.q.practice ? 1 : Math.round(1000 * (1 - Math.min(a.t, S.qLimit) / S.qLimit / 2)); S.lastGain[id] = pts; if (!S.q.practice) S.players[id].score += pts; }
    else S.lastGain[id] = 0;
  }
  render(); publish();
  if (S.auto) schedule(showBoard() ? board : nextQuestion, REVEAL_MS);
}
function showBoard() { if (S.q && S.q.practice) return false; return qNum() % BOARD_EVERY === 0 || S.qi + 1 >= S.rounds.length; }
function board() { clearTimers(); S.phase = "board"; render(); publish(); if (S.auto) schedule(nextQuestion, BOARD_MS); }
function finish() { clearTimers(); S.phase = "end"; render(); publish(); setTimeout(() => UI.confetti(innerWidth / 2, innerHeight / 3, 220), 300); }
function schedule(fn, ms) {
  clearTimeout(S.timer); S.autoAt = Date.now() + ms; S.timer = setTimeout(fn, ms);
  clearInterval(S.tick);
  S.tick = setInterval(() => { const b = $("#autobar"); if (b) b.style.width = Math.max(0, (S.autoAt - Date.now()) / ms * 100) + "%"; }, 100);
}
function togglePause() {
  S.auto = !S.auto;
  if (!S.auto) { clearTimeout(S.timer); clearInterval(S.tick); S.autoAt = 0; }
  else if (S.phase === "reveal") schedule(showBoard() ? board : nextQuestion, REVEAL_MS);
  else if (S.phase === "board") schedule(nextQuestion, BOARD_MS);
  render();
}
function closeRoom() {
  clearTimers();
  if (S.client) { const c = S.client, room = S.room; c.publish(NET.topic(room, "state"), { v: 2, phase: "closed" }, true); c.publish(NET.roomTopic(room), "", true); setTimeout(() => { c.publish(NET.topic(room, "state"), "", true); c.close(); }, 500); S.client = null; }
  S.room = null; dropSnap();
  setup();
}
const ranked = () => Object.values(S.players).sort((a, b) => b.score - a.score);

/* ---------- screens ---------- */
function topBar() {
  return `<header class="hbar"><span class="brand"><i></i>ClivEdu Live</span><span class="muted">${esc(S.set.title)} · ${esc(TYPES.find(t => t.id === S.type).name)}</span>
    <span class="code-sm">Code <b>${S.room}</b></span><span id="net" class="net ${S.status}">${S.status === "online" ? "Online" : "Reconnecting…"}</span>
    ${S.phase !== "lobby" && S.phase !== "end" ? `<button class="pill ${S.auto ? "" : "sel"}" data-pause>${S.auto ? "Pause" : "Resume auto"}</button>` : ""}
    <button class="pill" data-close>End game</button></header>`;
}
function renderLobbyList() {
  const el = $("#roster"); if (!el) return render();
  const n = Object.keys(S.players).length;
  $("#joined").textContent = `${n} joined`;
  $("[data-start]").disabled = !n;
  el.innerHTML = Object.values(S.players).map(p => `<span class="chip ${p.type}">${p.type === "team" ? "Team" : "Solo"} · ${esc(p.name)}<button class="x" data-kick="${p.id}" aria-label="Remove ${esc(p.name)}">×</button></span>`).join("") || `<p class="muted">Waiting for players…</p>`;
}
function optTiles(q, rev) {
  if (q.type === "tf") return `<div class="opts two">${q.opts.map((t, i) => `<div class="opt ${i ? "o0" : "o3"} ${rev ? (i === q.correct ? "ok" : "dim") : ""}"><span class="tfmark">${i ? "✗" : "✓"}</span><span>${t}</span></div>`).join("")}</div>`;
  return `<div class="opts">${q.opts.map((t, i) => `<div class="opt o${i} ${rev ? (i === q.correct ? "ok" : "dim") : ""}">${UI.shape(i)}<span>${esc(t)}</span>${rev && i === q.correct ? '<span class="tick">✓</span>' : ""}</div>`).join("")}</div>`;
}
function render() {
  if (S.phase === "setup") return;
  const n = Object.keys(S.players).length;
  let body = "";
  if (S.phase === "lobby") {
    body = `<section class="lobby">
      <div class="joinbox"><p class="muted strong">Go to \u00b7 Saytga kiring</p><p class="url">cliveduclass.netlify.app/play</p><p class="muted strong">Code \u00b7 Kod</p><p class="bigcode">${S.room}</p>
        <p class="muted">${qTotal()} questions \u00b7 a practice question first</p></div>
      <div class="roster"><div class="row between"><h2 id="joined">${n} joined</h2><button class="btn y xl" data-start ${n ? "" : "disabled"}>Start →</button></div>
        <div class="chips" id="roster"></div></div></section>
      <section class="howto"><h2>How to play \u00b7 Qanday o\u2018ynaladi</h2><ol>
        <li><b>Open the website on a phone.</b><span>Telefonda saytni oching.</span></li>
        <li><b>Type the code and your name.</b><span>Kodni va ismingizni yozing.</span></li>
        <li><b>Team = one phone for the team. Just me = your own phone.</b><span>Jamoa \u2014 bitta telefon. Yakka \u2014 o\u2018z telefoningiz.</span></li>
        <li><b>Read the question on the board. Tap your answer on the phone.</b><span>Savolni doskadan o\u2018qing, javobni telefonda bosing.</span></li>
        <li><b>Right and fast = more points!</b><span>To\u2018g\u2018ri va tez = ko\u2018proq ball!</span></li></ol></section>`;
  } else if (S.phase === "question" || S.phase === "reveal") {
    const q = S.q, rev = S.phase === "reveal";
    const left = Math.max(0, S.qLimit - (Date.now() - S.qStart) / 1000);
    let main = "";
    if (q.type === "build") main = `<h1 class="qtext small">${esc(q.text)}</h1><div class="wordrow">${(rev ? q.answer : q.words).map(w => `<span class="wtile ${rev ? "ok" : ""}">${esc(w)}</span>`).join("")}<span class="wtile end">${q.end}</span></div>`;
    else if (q.type === "clue") main = `<div class="clues">${q.clues.slice(0, rev ? q.clues.length : S.clueShown).map((c, k) => `<p class="clue"><small>Clue ${k + 1}</small>${esc(c)}</p>`).join("")}</div>${optTiles(q, rev)}`;
    else if (q.type === "tf") main = `<h1 class="qtext">${esc(q.text)}</h1>${optTiles(q, rev)}${rev && q.fix ? `<p class="fixline">Correct: <b>${esc(q.fix)}</b></p>` : ""}`;
    else main = `<h1 class="qtext">${esc(q.text)}</h1>${optTiles(q, rev)}`;
    const nRight = Object.values(S.lastGain).filter(x => x > 0).length;
    body = `<section class="qscreen">
      <div class="row between"><span class="eb">${q.practice ? "Practice \u00b7 Mashq \u2014 no points" : `${TYPE_LABEL[q.type]} \u00b7 ${qNum()} of ${qTotal()}`}</span>
        <span class="howline">${esc(HOW[q.type][0])}<small>${esc(HOW[q.type][1])}</small></span>
        ${rev ? `<span class="verdict-sm">${nRight} of ${n} correct</span>` : `<span class="ring" id="ring" style="--p:${(left / S.qLimit).toFixed(3)}"><b id="tleft">${Math.ceil(left)}</b></span>`}</div>
      ${main}
      ${rev && q.type === "build" ? `<p class="fixline">${nRight} of ${n} got the order right.</p>` : ""}
      <div class="row between">
        ${rev ? `<div class="autowrap">${S.auto ? `<span class="muted">${showBoard() ? "Scores next" : "Next question"}</span><span class="autotrack"><i id="autobar"></i></span>` : ""}</div>${showBoard() ? `<button class="btn y xl" data-board>Scores →</button>` : `<button class="btn y xl" data-next>Next question →</button>`}`
              : `<span class="muted strong" id="ansCount">Answers: ${Object.keys(S.answers).length} / ${n}</span><button class="btn" data-reveal>Show answer now</button>`}
      </div></section>`;
  } else if (S.phase === "board") {
    const r = ranked(), last = S.qi + 1 >= S.rounds.length;
    body = `<section class="wrapc"><div class="row between"><h1 class="big">Scores</h1><span class="eb">${qNum()} of ${qTotal()} done</span></div>
      <div class="lboard">${r.slice(0, 6).map((p, k) => `<div class="lrow ${k === 0 ? "first" : ""}"><span class="pos">${k + 1}</span><span class="nm">${esc(p.name)} <small>${p.type === "team" ? "Team" : "Solo"}</small></span>${S.lastGain[p.id] ? `<span class="gain">+${S.lastGain[p.id]}</span>` : ""}<b>${p.score}</b></div>`).join("")}</div>
      <div class="row between"><div class="autowrap">${S.auto ? `<span class="muted">${last ? "Final results" : "Next question"} in a moment</span><span class="autotrack"><i id="autobar"></i></span>` : ""}</div>
        <button class="btn y xl" data-next>${last ? "Final results →" : "Next question →"}</button></div></section>`;
  } else if (S.phase === "end") {
    const r = ranked(), pod = [r[1], r[0], r[2]];
    body = `<section class="wrapc"><h1 class="big center">Winners!</h1>
      <div class="podium">${pod.map((p, k) => p ? `<div class="pod p${[2, 1, 3][k]}"><span class="pname">${esc(p.name)}</span><span class="pscore">${p.score}</span><div class="block">${[2, 1, 3][k]}</div></div>` : `<div class="pod empty"></div>`).join("")}</div>
      <div class="lboard compact">${r.slice(3).map((p, k) => `<div class="lrow"><span class="pos">${k + 4}</span><span class="nm">${esc(p.name)}</span><b>${p.score}</b></div>`).join("")}</div>
      <div class="row center gap"><button class="btn y xl" data-again>Play again</button><button class="btn" data-close>Close game</button></div></section>`;
  }
  app.innerHTML = topBar() + body;
  if (S.phase === "lobby") renderLobbyList();
}

document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  const d = t.dataset;
  if (d.set) { S.set = sets.find(s => s.id === d.set); setup(); }
  else if (d.type) { S.type = d.type; setup(); }
  else if (d.time) { S.limit = +d.time; setup(); }
  else if (d.auto) { S.auto = d.auto === "1"; setup(); }
  else if (d.create != null) create();
  else if (d.start != null) nextQuestion();
  else if (d.reveal != null) reveal();
  else if (d.board != null) board();
  else if (d.next != null) nextQuestion();
  else if (d.pause != null) togglePause();
  else if (d.kick) { delete S.players[d.kick]; renderLobbyList(); publish(); }
  else if (d.again != null) { Object.values(S.players).forEach(p => p.score = 0); S.rounds = withPractice(await buildRounds()); S.qi = -1; lobby(); }
  else if (d.close != null) closeRoom();
  else if (d.resume) resume(d.resume);
  else if (d.endroom) { t.disabled = true; t.textContent = "Ending…"; endRemote(d.endroom); }
});
/* Closing or refreshing this page keeps the game listed: open Live again on this device and tap Continue. */
setup();
})();
</script>
</body>
</html>
