[build]
  publish = "."
  # stamp: adds ?v=<commit> to script and style links so a deploy never mixes old and new files
  # legacy: rewrites scripts into older JavaScript for smart boards and old Android browsers
  command = "node tools/stamp.cjs && node tools/legacy.cjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Pictures, sounds, icons: they rarely change, keep them on the phone
[[headers]]
  for = "/avatars/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=2592000"
[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
[[headers]]
  for = "/listen/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=2592000"

# Security headers for every page. connect-src lists the public MQTT brokers the live games use.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' wss://broker.emqx.io:8084 wss://broker.hivemq.com:8884 wss://test.mosquitto.org:8081; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
