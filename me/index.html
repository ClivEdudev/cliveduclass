<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/brand/icon-48.png">
<link rel="apple-touch-icon" href="/brand/icon-180.png">
<link rel="manifest" href="/brand/site.webmanifest">
<meta property="og:image" content="https://clivedu.me/brand/logo.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClivEdu Class · My profile</title>
<meta name="theme-color" content="#FFFFFF">
<style>
/* Student profile: who I am, how I am doing, homework, and a practice round of my own mistakes. */
:root{
  --pg:#EEF3F8; --card:#FFFFFF; --ink:#12263A; --sub:#4B5F73; --line:#D2DCE6; --teal:#0B6E70;
  --yel:#FFC93C; --yelsoft:#FFF6D6; --blue:#1F5FD1; --green:#1C8F50; --greensoft:#E3F5EA; --red:#B42318; --redsoft:#FDECEA;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--pg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
a{color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px;zoom:var(--clv-scale,1)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gear,.back{font-weight:800;font-size:15px;font-family:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;text-decoration:none}
.box{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.box h2{font-size:21px;font-weight:800;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.box h2 small{font-size:14px;color:var(--teal);font-weight:600}
.me{display:flex;gap:14px;align-items:center}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.av.pick{cursor:pointer;border:0;padding:0;position:relative;overflow:visible}
.av.pick::after{content:"✏️";position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--card,#fff);display:grid;place-items:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.av{width:64px;height:64px;border-radius:50%;background:var(--yel);display:grid;place-items:center;font-weight:800;font-size:28px;flex:none;color:#12263A}
.me h1{font-size:clamp(24px,6vw,34px);line-height:1.1;font-weight:800;overflow-wrap:anywhere}
.me p{color:var(--sub);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--pg);border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--sub);font-weight:700}
@media (max-width:440px){.stats{grid-template-columns:repeat(2,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;font-weight:800;font-size:17px;font-family:inherit;text-decoration:none;background:var(--yel);color:#12263A;border:0;cursor:pointer;align-self:flex-start}
.btn.tg{background:#229ED9;color:#fff}
.btn.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--sub);font-size:15px}
.hwf{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;white-space:normal}
.hwf .btn{font-size:15px;padding:9px 14px}
.hwf .tg{background:#229ED9;color:#fff}
.hwf small{display:block;width:100%;font-weight:700}
.hw{border-left:4px solid var(--yel);background:var(--yelsoft);border-radius:10px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.hw small{display:block;color:var(--sub);font-weight:700;font-size:13px;margin-bottom:2px;white-space:normal}
/* practice */
.prac{border:2px solid var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.prac .lt{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.prac .q{font-size:22px;font-weight:800;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:8px}
.opt{font-weight:700;font-size:17px;font-family:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-align:left}
.opt.ok{background:var(--greensoft);border-color:var(--green)}
.opt.no{background:var(--redsoft);border-color:var(--red)}
.inp{font-weight:600;font-size:18px;font-family:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.res{font-weight:800}
.res.good{color:var(--green)}.res.bad{color:var(--red)}
.play{font-weight:800;font-size:15px;font-family:inherit;border:0;border-radius:999px;padding:8px 14px;background:var(--ink);color:var(--card);cursor:pointer;align-self:flex-start}
.prog{height:8px;border-radius:99px;background:var(--pg);overflow:hidden}.prog i{display:block;height:100%;background:var(--green)}
/* lists */
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:15px;flex-wrap:wrap}
.row:first-child{border-top:0}
.row .q{flex:1 1 240px;min-width:0;overflow-wrap:anywhere}
.row s{color:var(--red)}
.row b.c{color:var(--green)}
.tag{font-size:12px;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.06em}
.chart{display:flex;align-items:flex-end;gap:4px;height:90px}
.chart div{flex:1;background:var(--teal);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart div.z{background:var(--line)}
.days{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:15px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-weight:700;font-size:15px;font-family:inherit;padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.saved{color:var(--green);font-weight:800;font-size:15px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
html[data-theme="dark"]{--pg:#0E1A26;--card:#16263A;--ink:#EAF0F5;--sub:#A9B8C7;--line:#2B3E52;--teal:#6FD6D8;--yelsoft:#2E2A14;--blue:#8CB2F5;--greensoft:#123A26;--redsoft:#3A1A1A;--red:#FF8A80;--green:#6CCB8A;color-scheme:dark}
/* level and badges (lessons/progress.js) */
.lvbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lvbox .medal{width:132px;height:132px;flex:none}
.medal .pet{fill:#E4E9F7;stroke:#C5CEE8;stroke-width:.6}.medal .pet.on{fill:#F4A91D;stroke:#FFE2A6}.medal .pet.on:nth-child(even){fill:#FFC54D}
.medal .core{fill:#2338A8}.medal .lv{fill:#fff;font:700 17px "Unbounded",system-ui;text-anchor:middle}.medal .lvl{fill:#C9D3FF;font:600 6.4px system-ui;text-anchor:middle}
html[data-theme="dark"] .medal .pet:not(.on){fill:#1E2A60;stroke:#33408A}
.lvbox .t{flex:1;min-width:200px}.lvbox .t b{display:block;font-size:22px}
.lvbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}.lvbar i{display:block;height:100%;background:linear-gradient(90deg,#F4A91D,#FFD27A)}
.bdgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:14px}
.bdgs div{text-align:center;font-size:13px;font-weight:700;line-height:1.2;display:grid;justify-items:center;gap:4px}
.bdgs div i{width:52px;height:52px;display:grid;place-items:center;font-size:24px;font-style:normal;background:url(/brand/star.svg) center/contain no-repeat}
.bdgs div.no{opacity:.45}.bdgs div.no i{filter:grayscale(1)}
.bdgs small{font-weight:500;color:var(--sub);font-size:12px}
.cidlink{display:inline-flex;gap:6px;align-items:center;margin-top:6px;padding:6px 12px;border-radius:999px;font-size:.85rem;text-decoration:none;color:#fff;background:linear-gradient(120deg,#2b1a6b,#6c4ff0 60%,#22cfc6);box-shadow:0 6px 20px -8px #6c4ff0}
</style>
<script src="../lessons/settings.js"></script>
<script src="../lessons/account.js"></script>
<script src="../lessons/progress.js"></script>
</head>
<body>
<main class="wrap" id="app"></main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const keep = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const A = () => window.CLV_ACCOUNT;
  const day = (t = Date.now()) => new Date(t + 5 * 3600e3).toISOString().slice(0, 10);
  const norm = x => String(x).toLowerCase().replace(/[‘’`]/g, "'").replace(/\b(\w+)n't\b/g, "$1 not").replace(/\bi'm\b/g, "i am")
    .replace(/\b(he|she|it|what|that)'s\b/g, "$1 is").replace(/\b(we|you|they)'re\b/g, "$1 are").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  let homework = null, days = null, saved = "", prac = null;
  const AU = new Audio();

  const mistakes = () => load("clv-mistakes", []);
  const open = () => mistakes().filter(m => !m.fx);
  function stats() {
    const pts = load("clv-points", {}), s = A() && A().summary;
    const total = Object.values(pts).reduce((a, b) => a + (+b || 0), 0);
    return { points: s ? Math.max(s.points, total) : total, lessons: Object.keys(pts).filter(k => pts[k] > 0).length, streak: s ? s.streak : 0, open: open().length };
  }

  function practiceHTML() {
    if (!prac) return "";
    if (prac.i >= prac.list.length) {
      return `<div class="prac"><p class="q">\u{1F389} Done! ${prac.fixed} of ${prac.list.length} fixed.</p><p class="muted">Zo‘r! ${prac.fixed} ta xato tuzatildi.</p>
        <div class="seg"><button class="btn" data-act="again">Practise again · Yana</button><button class="btn sec" data-act="stop">Close · Yopish</button></div></div>`;
    }
    const m = prac.list[prac.i], done = prac.ans != null;
    const pct = Math.round(prac.i / prac.list.length * 100);
    let body = "";
    if (m.o && m.o.length && !m.w) {
      body = `<div class="opts">${prac.order.map(j => {
        const cls = !done ? "" : (m.o[j] === m.c ? "ok" : (j === prac.ans ? "no" : ""));
        return `<button class="opt ${cls}" data-opt="${j}" ${done ? "disabled" : ""}>${esc(m.o[j])}</button>`; }).join("")}</div>`;
    } else {
      body = `<input class="inp" id="pin" type="text" autocomplete="off" spellcheck="false" placeholder="Write it… · Yozing…" ${done ? "disabled" : ""} value="${esc(prac.typed || "")}">
        ${done ? "" : `<button class="btn" data-act="check">Check · Tekshirish</button>`}`;
    }
    const res = !done ? "" : prac.good ? `<p class="res good">✓ Correct! Fixed. · To‘g‘ri!</p>` : `<p class="res bad">✗ The answer is: <b>${esc(m.c)}</b></p>`;
    return `<div class="prac"><div class="prog"><i style="width:${pct}%"></i></div>
      <span class="lt">${esc(m.lt || m.l)} · ${prac.i + 1} / ${prac.list.length}</span>
      ${m.au ? `<button class="play" data-play="${esc(m.au)}">▶ Listen · Tinglash</button>` : ""}
      <p class="q">${esc(m.q || "")}</p>${body}${res}
      ${done ? `<button class="btn" data-act="next">Next → · Keyingisi</button>` : ""}</div>`;
  }
  function startPractice() {
    const list = open().slice().reverse().slice(0, 10);
    if (!list.length) return;
    prac = { list, i: 0, fixed: 0 }; nextQ(true);
  }
  function nextQ(first) {
    if (!first) prac.i++;
    prac.ans = null; prac.good = false; prac.typed = "";
    const m = prac.list[prac.i];
    if (m && m.o) { prac.order = m.o.map((_, j) => j).sort(() => Math.random() - .5); }
    draw();
    setTimeout(() => { const p = $("#pin"); if (p) p.focus(); const pr = $(".prac"); if (pr && pr.scrollIntoView) pr.scrollIntoView({ block: "nearest" }); }, 20);
  }
  function answer(good, ans) {
    const m = prac.list[prac.i];
    prac.ans = ans; prac.good = good;
    if (good) {
      prac.fixed++;
      const all = mistakes(); const x = all.find(y => y.id === m.id); if (x) { x.fx = 1; keep("clv-mistakes", all); }
    }
    draw();
  }

  function levelBox() {
    const PR = window.CLV_PROGRESS; if (!PR) return "";
    const S = PR.stats();
    return `<section class="box"><h2>⭐ My level <small>Darajam</small></h2>
      <div class="lvbox">${PR.medallion(S, 132)}<div class="t"><b>${esc(S.name)}</b><span class="muted">${esc(S.nameUz)} · level ${S.level}</span>
        <div class="lvbar"><i style="width:${Math.round(100 * S.into / Math.max(1, S.need))}%"></i></div><span class="muted">${S.total} points · ${S.next - S.total} to level ${S.level + 1}</span></div></div>
      <div class="bdgs">${S.badges.map(b => `<div class="${b.got ? "" : "no"}" title="${esc(b.how)}"><i>${b.icon}</i>${esc(b.en)}<small>${esc(b.got ? b.uz : b.how)}</small></div>`).join("")}</div></section>`;
  }
  function draw() {
    const acc = A(), u = acc && acc.user, s = stats();
    const all = mistakes(), op = all.filter(m => !m.fx).slice().reverse();
    const games = load("clv-games", []).slice().reverse();
    let chart = "";
    if (days) {
      const keys = []; for (let i = 13; i >= 0; i--) keys.push(day(Date.now() - i * 864e5));
      const max = Math.max(10, ...keys.map(k => days[k] || 0));
      chart = `<section class="box"><h2>My last 2 weeks <small>Oxirgi 2 hafta</small></h2>
        <div class="chart" role="img" aria-label="Points per day">${keys.map(k => `<div class="${days[k] ? "" : "z"}" style="height:${Math.max(2, (days[k] || 0) / max * 100)}%" title="${k}: ${days[k] || 0}"></div>`).join("")}</div>
        <div class="days"><span>${keys[0].slice(5)}</span><span>today · bugun</span></div></section>`;
    }
    $("#app").innerHTML = `
      <div class="top"><a class="back" href="../">← My lessons</a><button class="gear" data-settings aria-label="Settings">⚙️ Settings</button></div>
      <section class="box">
        <div class="me"><button class="av pick" data-settings aria-label="Change my picture · Rasmni o‘zgartirish">${u && /^[gbn]\d\d$/.test(u.avatar || "") ? `<img src="/avatars/${u.avatar}.webp?v=2" alt="">` : u ? esc(String(u.name || "?").charAt(0).toUpperCase()) : "\u{1F464}"}</button>
          <div><h1>${u ? esc(u.name) : "My profile"}</h1><p>${u ? (u.username ? "@" + esc(u.username) + " · " : "") + "Telegram ✓" + (u.group ? ` · ${u.group === "b" ? "Beginner" : "Elementary"}` : "") : "Profilim · not signed in"}</p>${u && /^\d{12}$/.test(u.cid || "") ? `<a class="cidlink" href="https://clivesystems.netlify.app/me.html" target="_blank" rel="noopener">\u{1FAAA} c-ID <b>${u.cid.replace(/(\d{4})(?=\d)/g, "$1 ")}</b> · see my card ↗</a>` : ""}</div></div>
        <div class="stats">
          <div class="stat"><b>${s.points}</b><span>⭐ points · ball</span></div>
          <div class="stat"><b>${s.streak}</b><span>\u{1F525} days in a row</span></div>
          <div class="stat"><b>${s.lessons}</b><span>\u{1F4DA} lessons · dars</span></div>
          <div class="stat"><b>${s.open}</b><span>\u{1F3AF} to fix · xato</span></div></div>
        ${u ? "" : `<p class="muted">Sign in with Telegram to keep your points on every phone and get homework in Telegram.<br>Telegram orqali kiring — ballaringiz saqlanadi.</p><button class="btn tg" data-signin>✈️ Sign in with Telegram</button>`}
      </section>
      ${levelBox()}
      ${u ? `<section class="box"><h2>\u{1F4DD} Homework <small>Uy vazifasi</small></h2>
        ${homework == null ? `<p class="muted">Loading…</p>` : homework.length ? homework.map(h => `<div class="hw"><small>${esc(day(h.t))}</small>${esc(h.text)}${h.file ? `<div class="hwf"><small>\u{1F4CE} ${esc(h.file.name)}</small>
          <button class="btn" data-act="hwdl" data-id="${esc(h.id)}">⬇️ Download · Yuklab olish</button>
          <button class="btn tg" data-act="hwtg" data-id="${esc(h.id)}">✈️ Send to my Telegram</button></div>` : ""}</div>`).join("") : `<p class="muted">No homework yet. \u{1F389} · Hozircha yo‘q.</p>`}</section>` : ""}
      <section class="box"><h2>\u{1F3AF} My mistakes <small>Xatolarim</small></h2>
        <p class="muted">Every wrong answer from lessons and class games comes here. Practise them until they are fixed!<br>Darslardagi xatolaringiz shu yerda. Mashq qiling!</p>
        ${prac ? practiceHTML() : op.length ? `<button class="btn" data-act="practice">▶ Practise my mistakes (${Math.min(10, op.length)}) · Mashq</button>` : `<p class="res good">${all.length ? "All fixed! \u{1F31F} Hammasi tuzatildi!" : "No mistakes yet. Keep going! \u{1F44D}"}</p>`}
        ${op.length ? `<div class="list">${op.slice(0, 40).map(m => `<div class="row"><span class="tag">${esc(m.lt || m.l)}</span><span class="q">${esc(m.q)} — <s>${esc(m.a)}</s> → <b class="c">${esc(m.c)}</b></span></div>`).join("")}</div>` : ""}
      </section>
      ${chart}
      <section class="box"><h2>\u{1F3AE} My class games <small>O‘yinlarim</small></h2>
        ${games.length ? `<div class="list">${games.slice(0, 15).map(g => `<div class="row"><span class="q">${esc(new Date(g.t).toLocaleDateString())} · code ${esc(g.room)}</span><b>${g.pos === 1 ? "\u{1F3C6} " : ""}place ${g.pos} of ${g.of}</b><span>⭐ ${g.score}</span></div>`).join("")}</div>` : `<p class="muted">Play a class game and your results show up here.</p>`}
      </section>
      ${u ? `<section class="box"><h2>✏️ Edit profile <small>Tahrirlash</small></h2>
        <label class="f">My name · Ismim<input class="inp" id="pname" maxlength="40" value="${esc(u.name)}"></label>
        <div class="f"><b style="font-size:15px">My group · Guruhim</b><div class="seg" id="pgroup">
          <button data-g="a" aria-pressed="${u.group === "a"}">Elementary · Mon, Thu, Fri 14:00</button><button data-g="b" aria-pressed="${u.group === "b"}">Beginner · Mon, Thu 15:30</button></div></div>
        <div class="f"><b style="font-size:15px">Messages in Telegram · Telegram xabarlari</b><div class="seg" id="pnotify">
          <button data-n="1" aria-pressed="${u.notify !== false}">\u{1F514} On</button><button data-n="0" aria-pressed="${u.notify === false}">\u{1F515} Off</button></div></div>
        <div class="seg"><button class="btn" data-act="save">Save · Saqlash</button>${saved ? `<span class="saved">${esc(saved)}</span>` : ""}</div>
        <button class="btn sec" data-act="out">Sign out · Chiqish</button></section>` : ""}`;
  }

  document.addEventListener("click", async e => {
    const hb = e.target.closest('[data-act="hwdl"],[data-act="hwtg"]');
    if (hb) {
      const h = (homework || []).find(x => x.id === hb.dataset.id); if (!h) return;
      const label = hb.textContent; hb.disabled = true; hb.textContent = "…";
      try {
        if (hb.dataset.act === "hwdl") { await A().download("/homework/file?id=" + encodeURIComponent(h.id), h.file.name); hb.textContent = "✓ Downloaded"; }
        else { const j = await A().api("/homework/telegram", { body: { id: h.id } }); hb.textContent = j.ok ? "✓ Sent · Yuborildi" : "✗ Press START in the bot"; }
      } catch (er) { hb.textContent = "✗ " + er.message; }
      setTimeout(() => { hb.disabled = false; hb.textContent = label; }, 3500);
      return;
    }
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.play) { try { AU.src = b.dataset.play; AU.currentTime = 0; AU.play(); } catch (err) {} return; }
    if (b.dataset.opt != null && prac && prac.ans == null) { const m = prac.list[prac.i], j = +b.dataset.opt; return answer(m.o[j] === m.c, j); }
    if (b.dataset.g) { $("#pgroup").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); return; }
    if (b.dataset.n) { $("#pnotify").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); return; }
    const act = b.dataset.act; if (!act) return;
    if (act === "practice" || act === "again") startPractice();
    else if (act === "stop") { prac = null; draw(); }
    else if (act === "next") nextQ();
    else if (act === "check") { const v = ($("#pin") || {}).value || ""; if (!v.trim()) return; prac.typed = v; answer(norm(v) === norm(prac.list[prac.i].c), 1); }
    else if (act === "out") { await A().signOut(); location.href = "../"; }
    else if (act === "save") {
      const g = $("#pgroup [aria-pressed=true]"), n = $("#pnotify [aria-pressed=true]");
      b.disabled = true;
      try {
        const j = await A().api("/profile", { body: { name: $("#pname").value, group: g ? g.dataset.g : "", notify: !n || n.dataset.n === "1" } });
        A().setUser(j.user); try { localStorage.setItem("clv-name", JSON.stringify(j.user.name)); } catch (err) {} try { if (j.user.group) localStorage.setItem("clv-group", j.user.group); } catch (err) {}
        saved = "✓ Saved · Saqlandi";
      } catch (err) { saved = "✗ " + err.message; }
      draw(); setTimeout(() => { saved = ""; }, 3000);
    }
  });
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "pin") { const c = document.querySelector('[data-act="check"]'); if (c) c.click(); } });

  async function fetchMore() {
    const acc = A(); if (!acc || !acc.signedIn) return;
    try { const j = await acc.api("/me"); days = j.days || {}; acc.setUser(j.user); } catch (e) {}
    try { homework = (await acc.api("/homework")).items; } catch (e) { homework = []; }
    if (!prac) draw();
  }
  let lastUser = null;
  addEventListener("clv-account", e => {
    const id = e.detail.user && e.detail.user.id;
    if (id !== lastUser) { lastUser = id; homework = null; days = null; fetchMore(); }
    if (!prac && !(document.activeElement && document.activeElement.id === "pname")) draw();
  });
  draw();
  addEventListener("load", () => { lastUser = A() && A().user && A().user.id; draw(); fetchMore(); });
})();
</script>
</body>
</html>
