<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/brand/icon-48.png">
<link rel="apple-touch-icon" href="/brand/icon-180.png">
<link rel="manifest" href="/brand/site.webmanifest">
<meta property="og:image" content="https://clivedu.me/brand/logo.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ClivEdu Class · Class progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400..800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Teacher: every signed-in student at a glance, the class's common mistakes, and homework through the Telegram bot. */
:root{
  --ink:#12263A; --ink2:#1C3650; --night:#0B1828; --cream:#FFF8E7; --paper:#FFFDF6; --line:#EADFC4;
  --yellow:#FFC93C; --teal:#0B6E70; --mist:#BFD8D5; --slate:#4B5F73; --blue:#1F5FD1; --green:#157347; --mint:#D5F1E3; --red:#F2788B;
  --display:'Rubik',Verdana,sans-serif; --body:'Nunito',Verdana,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
a{color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:800 20px var(--display);display:flex;align-items:center;gap:10px}
.brand i{width:26px;height:26px;border-radius:7px}
.brand small{font:700 13px var(--body);color:var(--ink);background:var(--yellow);padding:3px 10px;border-radius:999px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font:800 16px var(--body);text-decoration:none;background:var(--yellow);color:var(--ink);white-space:nowrap;border:0;cursor:pointer}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px var(--mist)}
.btn.tg{background:#229ED9;color:#fff}
.btn:disabled{opacity:.55;cursor:default}
h1.t{font:800 clamp(32px,5vw,52px)/1.05 var(--display)}
.sub{color:var(--mist)}
.tilesrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:10px}
.tile{background:var(--ink);border-radius:18px;padding:14px 16px}
.tile b{display:block;font:800 34px var(--display);font-variant-numeric:tabular-nums}
.tile span{color:var(--mist);font-weight:700;font-size:14px}
.panel{background:var(--ink);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font:800 24px var(--display);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.panel h2 small{font:700 14px var(--body);color:var(--mist)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:800 14px var(--body);padding:7px 14px;border-radius:999px;border:2px solid var(--ink2);background:var(--night);color:var(--mist);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:16px;min-width:760px}
th{font:800 13px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--mist);text-align:left;padding:8px;border-bottom:2px solid var(--ink2);cursor:pointer;white-space:nowrap;user-select:none}
th[aria-sort]::after{content:" ↓";color:var(--yellow)}
td{padding:9px 8px;border-bottom:1px solid var(--ink2);font-variant-numeric:tabular-nums;vertical-align:middle}
tr.st{cursor:pointer}
tr.st:hover td,tr.st.sel td{background:var(--ink2)}
td.n b{font-weight:800}td.n small{display:block;color:var(--mist)}
.g{font:800 12px var(--body);padding:3px 9px;border-radius:999px;background:var(--teal)}
.g.b{background:var(--blue)}.g.none{background:var(--ink2);color:var(--mist)}
.hot{color:var(--yellow);font-weight:800}
.dim{color:var(--mist)}
.warn{color:var(--red);font-weight:800}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.cm{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--ink2)}
.cm:first-of-type{border-top:0}
.cm .q{font-weight:800;overflow-wrap:anywhere}
.cm .meta{font-size:14px;color:var(--mist)}
.cm .ans{font-size:15px}.cm .ans s{color:var(--red)}.cm .ans b{color:#6CCB8A}
.pill{font:800 13px var(--body);background:var(--yellow);color:var(--ink);border-radius:999px;padding:2px 9px;margin-right:6px}
textarea{font:600 17px var(--body);padding:12px;border-radius:14px;border:2px solid var(--ink2);background:var(--night);color:var(--cream);width:100%;min-height:120px;resize:vertical}
.ok{color:#6CCB8A;font-weight:800}.err{color:var(--red);font-weight:800}
.att{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.att label{display:inline-flex;align-items:center;gap:8px;font:800 15px var(--body);padding:9px 16px;border-radius:999px;border:2px dashed var(--mist);color:var(--cream);cursor:pointer}
.att label:hover,.att label:focus-within{border-color:var(--yellow);color:var(--yellow)}
.att input{position:absolute;width:1px;height:1px;opacity:0}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--cream);color:var(--ink);border-radius:999px;padding:6px 8px 6px 14px;font:700 14px var(--body);max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.chip button{border:0;background:var(--ink);color:var(--cream);width:26px;height:26px;border-radius:50%;cursor:pointer;font:800 14px var(--body)}
.hw .f{display:block;margin-top:4px;color:var(--yellow);font-weight:700}
.face{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px}
.live{display:inline-flex;align-items:center;gap:7px;font:800 13px var(--body);color:var(--mist);padding:0 6px}
.live i{width:9px;height:9px;border-radius:50%;background:#2FCB7C;box-shadow:0 0 0 4px rgba(47,203,124,.18)}
.live.blink i{animation:lblink .8s}
@keyframes lblink{0%{box-shadow:0 0 0 0 rgba(47,203,124,.7)}100%{box-shadow:0 0 0 12px rgba(47,203,124,0)}}
.hw{border-left:4px solid var(--yellow);padding:6px 10px;background:var(--night);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.hw small{display:block;color:var(--mist);font-weight:700;white-space:normal}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px}
.det h3{font:800 17px var(--display);color:var(--yellow);margin-bottom:6px}
.det .row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--ink2);font-size:15px}
.det .row span:first-child{min-width:0;overflow-wrap:anywhere}
.chart{display:flex;align-items:flex-end;gap:3px;height:70px}
.chart div{flex:1;background:var(--teal);border-radius:3px 3px 0 0;min-height:2px}
.chart div.z{background:var(--ink2)}
.gate{max-width:520px;margin:10vh auto 0;background:var(--cream);color:var(--ink);border-radius:28px;padding:30px;display:flex;flex-direction:column;gap:14px}
.gate h1{font:800 32px var(--display)}
.gate input{font:700 20px var(--body);padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.gate .err{color:#B42318}
.empty{color:var(--mist);padding:8px 0}
button:focus-visible,input:focus-visible,a:focus-visible,textarea:focus-visible,tr:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
</style>
<script src="../../lessons/settings.js"></script>
<script src="../../lessons/account.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const app = $("#app");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const A = () => window.CLV_ACCOUNT;
  const day = (t = Date.now()) => new Date(t + 5 * 3600e3).toISOString().slice(0, 10);
  const LNAME = { rev: "Big Revision", lis1: "Listening 1", v1: "Word Power", s1: "Beginner 1" };
  const lname = k => LNAME[k] || (/^b\d+$/.test(k) ? "Beginner " + k.slice(1) : /^\d+$/.test(k) ? "Lesson " + k : k === "game" ? "Live game" : k);
  const ago = t => { if (!t) return "never"; const m = Math.round((Date.now() - t) / 60000); if (m < 2) return "now"; if (m < 60) return m + " min ago"; const h = Math.round(m / 60); if (h < 24) return h + " h ago"; const d = Math.round(h / 24); return d === 1 ? "yesterday" : d + " days ago"; };
  let data = null, sortKey = "points", filter = "all", selected = null, detail = null, sendTo = "all", sendKind = "hw", note = "", busy = false, attach = null;
  const kbSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";

  function gate(kind, err) {
    app.innerHTML = kind === "signin" ? `<div class="gate"><h1>Class progress</h1>
        <p>Sign in with your Telegram account to see your students’ progress and send homework through <b>@clivedubot</b>.</p>
        <button class="btn tg" data-signin>✈️ Sign in with Telegram</button>
        <a href="../" style="color:var(--slate);font-weight:700">← Teacher planner</a></div>`
      : `<form class="gate" id="claim"><h1>One more step</h1>
        <p>You are signed in as <b>${esc(A().user.name)}</b>. Enter the teacher code once to make this Telegram account the teacher. After that, no other account can become the teacher.</p>
        <input id="code" type="password" autocomplete="off" placeholder="Teacher code">
        ${err ? `<p class="err">${esc(err)}</p>` : ""}
        <button class="btn" type="submit" style="align-self:flex-start">Make me the teacher</button>
        <a href="../" style="color:var(--slate);font-weight:700">← Teacher planner</a></form>`;
    const f = $("#claim");
    if (f) f.addEventListener("submit", async e => {
      e.preventDefault();
      try { const j = await A().api("/teacher/claim", { body: { code: $("#code").value } }); A().setUser(j.user); load(); }
      catch (er) { gate("claim", er.message); }
    });
  }
  async function load() {
    const acc = A();
    if (!acc || !acc.signedIn) return gate("signin");
    if (!acc.user || !acc.user.teacher) return gate("claim");
    try { data = await acc.api("/teacher/students"); lastJson = JSON.stringify(data); }
    catch (e) { if (/Teacher only/.test(e.message)) return gate("claim", "This Telegram account is not the teacher."); app.innerHTML = `<div class="gate"><h1>Could not load</h1><p class="err">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`; return; }
    draw();
    if (selected) openDetail(selected);
  }
  /* live view: fetch again every 5 seconds while the page is open; redraw only if something changed,
     and never while the teacher is typing a message or choosing a file */
  let lastJson = "";
  async function quietRefresh() {
    const acc = A(); if (!acc || !acc.signedIn || !data || busy || attach) return;
    if (document.visibilityState !== "visible") return;
    const ae = document.activeElement; if (ae && /^(TEXTAREA|INPUT|SELECT)$/.test(ae.tagName)) return;
    if ($("#msg") && $("#msg").value.trim()) return;
    try {
      const fresh = await acc.api("/teacher/students"), j = JSON.stringify(fresh);
      let det = null;
      if (selected) { try { det = await acc.api("/teacher/student?id=" + encodeURIComponent(selected)); } catch (e) {} }
      if (j === lastJson && (!det || JSON.stringify(det) === JSON.stringify(detail))) return;
      lastJson = j; data = fresh; if (det) detail = det;
      const y = scrollY; draw(); scrollTo(0, y);
      const st = $("#liveTag"); if (st) { st.classList.remove("blink"); void st.offsetWidth; st.classList.add("blink"); }
    } catch (e) {}
  }
  setInterval(quietRefresh, 5000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") quietRefresh(); });
  async function openDetail(id) {
    selected = id; detail = null; draw();
    try { detail = await A().api("/teacher/student?id=" + encodeURIComponent(id)); } catch (e) { detail = { error: e.message }; }
    draw();
    const d = $("#detail"); if (d && d.scrollIntoView) d.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
  function rows() {
    const list = data.students.filter(s => filter === "all" || (filter === "none" ? !s.group : s.group === filter));
    const k = sortKey;
    return list.sort((a, b) => k === "name" ? String(a.name).localeCompare(b.name) : (b[k] || 0) - (a[k] || 0));
  }
  function detailHTML() {
    if (!selected) return "";
    const s = data.students.find(x => x.id === selected);
    if (!s) return "";
    if (!detail) return `<section class="panel" id="detail"><h2>${esc(s.name)}</h2><p class="dim">Loading…</p></section>`;
    if (detail.error) return `<section class="panel" id="detail"><h2>${esc(s.name)}</h2><p class="err">${esc(detail.error)}</p></section>`;
    const keys = []; for (let i = 13; i >= 0; i--) keys.push(day(Date.now() - i * 864e5));
    const max = Math.max(10, ...keys.map(k => detail.days[k] || 0));
    const per = Object.entries(s.perLesson || {}).sort((a, b) => b[1] - a[1]);
    return `<section class="panel" id="detail"><h2>${esc(s.name)} <small>${s.username ? "@" + esc(s.username) + " · " : ""}joined ${esc(new Date(s.joined).toLocaleDateString())} · last seen ${ago(s.lastSeen)}${s.notify ? "" : " · \u{1F515} messages off"}</small></h2>
      <div class="det">
        <div><h3>Points per lesson</h3>${per.length ? per.map(([k, v]) => `<div class="row"><span>${esc(lname(k))}</span><b>${v}</b></div>`).join("") : `<p class="empty">No points yet.</p>`}
          <h3 style="margin-top:12px">Last 2 weeks</h3><div class="chart">${keys.map(k => `<div class="${detail.days[k] ? "" : "z"}" style="height:${Math.max(3, (detail.days[k] || 0) / max * 100)}%" title="${k}: ${detail.days[k] || 0}"></div>`).join("")}</div></div>
        <div><h3>Mistakes (newest first)</h3>${detail.mistakes.length ? detail.mistakes.slice(0, 25).map(m => `<div class="row"><span>${m.fx ? "✅ " : ""}${esc(m.q)} — <s style="color:var(--red)">${esc(m.a)}</s> → <b style="color:#6CCB8A">${esc(m.c)}</b></span><span class="dim">${esc(lname(m.l))}</span></div>`).join("") : `<p class="empty">No mistakes recorded.</p>`}</div>
        <div><h3>Live games</h3>${detail.games.length ? detail.games.map(g => `<div class="row"><span>${esc(new Date(g.t).toLocaleDateString())} · ${esc(g.room)}</span><span>${g.pos === 1 ? "\u{1F3C6} " : ""}${g.pos}/${g.of} · ⭐${g.score}</span></div>`).join("") : `<p class="empty">No games yet.</p>`}</div>
      </div></section>`;
  }
  function draw() {
    if (!data) return;
    const st = data.students, today = st.filter(s => s.today > 0 || s.lastSeen >= Date.parse(data.today + "T00:00:00+05:00"));
    const r = rows();
    const th = (k, t) => `<th data-sort="${k}" ${sortKey === k ? 'aria-sort="descending"' : ""}>${t}</th>`;
    const gtag = g => g ? `<span class="g ${g}">${g.toUpperCase()}</span>` : `<span class="g none">—</span>`;
    app.innerHTML = `<div class="wrap">
      <div class="top"><div class="brand"><i aria-hidden="true"></i>ClivEdu Class <small>Teacher</small></div>
        <div class="acts"><a class="btn ghost" href="../">← Planner</a><span class="live" id="liveTag" title="Updates by itself every 5 seconds"><i></i>Live</span><button class="btn ghost" data-act="refresh">↻ Refresh</button><button class="btn tg" data-act="report">\u{1F4E8} Send today’s report to my Telegram</button><button class="btn ghost" data-settings>⚙️</button></div></div>
      <div><h1 class="t">Class progress</h1><p class="sub">Students appear here after they sign in with Telegram. Tap a student for details.</p></div>
      ${note ? `<p class="${note.startsWith("✗") ? "err" : "ok"}">${esc(note)}</p>` : ""}
      <div class="tilesrow">
        <div class="tile"><b>${st.length}</b><span>students signed in</span></div>
        <div class="tile"><b>${today.length}</b><span>active today</span></div>
        <div class="tile"><b>${st.reduce((a, s) => a + s.today, 0)}</b><span>points earned today</span></div>
        <div class="tile"><b>${st.reduce((a, s) => a + s.open, 0)}</b><span>mistakes still to fix</span></div>
      </div>
      <section class="panel"><h2>Students <small>${r.length} shown</small></h2>
        <div class="seg" id="filter">${[["all", "All"], ["a", "Elementary"], ["b", "Beginner"], ["none", "No group"]].map(([v, t]) => `<button data-f="${v}" aria-pressed="${filter === v}">${t}</button>`).join("")}</div>
        ${r.length ? `<div class="tbl"><table><thead><tr>${th("name", "Student")}<th>Group</th>${th("points", "⭐ Points")}${th("today", "Today")}${th("lessons", "Lessons")}${th("streak", "\u{1F525} Streak")}${th("open", "To fix")}${th("games", "Games")}${th("lastSeen", "Last seen")}</tr></thead><tbody>
          ${r.map(s => `<tr class="st ${selected === s.id ? "sel" : ""}" data-id="${esc(s.id)}" tabindex="0"><td class="n">${/^[gbn]\d\d$/.test(s.avatar || "") ? `<img class="face" src="/avatars/${s.avatar}.webp?v=2" alt="">` : ""}<b>${esc(s.name)}</b>${s.username ? `<small>@${esc(s.username)}</small>` : ""}</td><td>${gtag(s.group)}</td>
            <td><b>${s.points}</b></td><td class="${s.today ? "hot" : "dim"}">${s.today ? "+" + s.today : "—"}</td><td>${s.lessons}</td><td>${s.streak || "—"}</td>
            <td class="${s.open >= 5 ? "warn" : ""}">${s.open}</td><td>${s.games}${s.bestGame ? ` <span class="dim">(best ${s.bestGame})</span>` : ""}</td><td class="dim">${ago(s.lastSeen)}</td></tr>`).join("")}
          </tbody></table></div>` : `<p class="empty">No students yet. Ask them to open the website, tap ⚙️ or “Sign in” and choose “Sign in with Telegram”.</p>`}
      </section>
      ${detailHTML()}
      <div class="grid2">
        <section class="panel"><h2>Common mistakes <small>the class gets these wrong most</small></h2>
          ${data.common.length ? data.common.slice(0, 15).map(c => `<div class="cm"><span class="q"><span class="pill">${c.n}</span>${esc(c.q)}</span>
            <span class="ans">${c.top ? `Wrong: <s>${esc(c.top)}</s> · ` : ""}Right: <b>${esc(c.c)}</b></span>
            <span class="meta">${esc(lname(c.l))} · ${esc(c.who.join(", "))}</span></div>`).join("") : `<p class="empty">Nothing yet. Mistakes from lessons and live games show up here.</p>`}
        </section>
        <section class="panel"><h2>Send in Telegram <small>through @clivedubot</small></h2>
          <div class="seg" id="kind"><button data-k="hw" aria-pressed="${sendKind === "hw"}">\u{1F4DD} Homework</button><button data-k="msg" aria-pressed="${sendKind === "msg"}">\u{1F4E2} Message</button></div>
          <textarea id="msg" placeholder="${sendKind === "hw" ? "e.g. Workbook page 12, exercises 1–3. Write 5 sentences with can." : "e.g. No class tomorrow. See you on Wednesday!"}"></textarea>
          <div class="att">${attach ? `<span class="chip">\u{1F4CE} <span>${esc(attach.name)}</span> ${kbSize(attach.size)}<button data-act="unattach" aria-label="Remove the file">✕</button></span>`
            : `<label>\u{1F4CE} Attach a file · Fayl biriktirish<input type="file" id="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.jpg,.jpeg,.png,.mp3,.m4a,.zip"></label>`}
            <span class="dim" style="font-size:13px">PDF, Word, PowerPoint, pictures, audio · up to 5 MB</span></div>
          <div class="seg" id="to">${[["all", "Everyone"], ["group:a", "Elementary"], ["group:b", "Beginner"]].map(([v, t]) => `<button data-to="${v}" aria-pressed="${sendTo === v}">${t}</button>`).join("")}</div>
          <button class="btn" data-act="send" ${busy ? "disabled" : ""} style="align-self:flex-start">${busy ? "Sending…" : "Send"}</button>
          <p class="dim" style="font-size:14px">Homework is also saved on each student’s profile page. Students who turned messages off (/stop) are skipped.</p>
          ${(data.homework || []).length ? `<h2 style="font-size:18px;margin-top:6px">Recent homework</h2>` + data.homework.slice(0, 5).map(h => `<div class="hw"><small>${esc(day(h.t))} · ${h.to === "all" ? "everyone" : "group " + h.to.slice(6).toUpperCase()}</small>${esc(h.text)}${h.file ? `<span class="f">\u{1F4CE} ${esc(h.file.name)}</span>` : ""}</div>`).join("") : ""}
        </section>
      </div></div>`;
  }
  app.addEventListener("click", async e => {
    const tr = e.target.closest("tr.st"); if (tr) return selected === tr.dataset.id ? (selected = null, draw()) : openDetail(tr.dataset.id);
    const thd = e.target.closest("th[data-sort]"); if (thd) { sortKey = thd.dataset.sort; return draw(); }
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.f) { filter = b.dataset.f; return draw(); }
    if (b.dataset.k) { const t = $("#msg").value; sendKind = b.dataset.k; draw(); $("#msg").value = t; return; }
    if (b.dataset.to) { const t = $("#msg").value; sendTo = b.dataset.to; draw(); $("#msg").value = t; return; }
    const act = b.dataset.act;
    if (act === "unattach") { const t = $("#msg").value; attach = null; draw(); $("#msg").value = t; return; }
    if (act === "refresh") { note = ""; load(); }
    else if (act === "report") {
      b.disabled = true;
      try { const j = await A().api("/teacher/report", { method: "POST" }); note = j.ok ? "✓ Report sent to your Telegram." : "✗ Telegram said: " + (j.why || "error"); }
      catch (er) { note = "✗ " + er.message; }
      draw();
    } else if (act === "send") {
      const text = $("#msg").value.trim(); if (!text && !attach) { $("#msg").focus(); return; }
      busy = true; draw(); $("#msg").value = text;
      try {
        let j;
        if (attach) {
          const f = new FormData();
          f.append("text", text); f.append("to", sendTo); f.append("homework", String(sendKind === "hw")); f.append("file", attach, attach.name);
          j = await A().api("/teacher/send", { form: f });
        } else j = await A().api("/teacher/send", { body: { text, to: sendTo, homework: sendKind === "hw" } });
        note = `✓ Sent to ${j.sent} of ${j.of} student${j.of === 1 ? "" : "s"}${j.file ? " with the file (your copy is in your Telegram)" : ""}.` + (j.failed.length ? ` Not delivered: ${j.failed.join(", ")} (they may have blocked the bot).` : "");
        attach = null; busy = false; await load(); return;
      } catch (er) { note = "✗ " + er.message; busy = false; draw(); $("#msg").value = text; }
    }
  });
  app.addEventListener("change", e => {
    if (e.target.id !== "file") return;
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const t = $("#msg").value;
    if (f.size > 5 * 1048576) { note = `✗ “${f.name}” is ${kbSize(f.size)}. The limit is 5 MB.`; attach = null; }
    else { attach = f; note = ""; }
    draw(); $("#msg").value = t;
  });
  app.addEventListener("keydown", e => { const tr = e.target.closest && e.target.closest("tr.st"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tr.click(); } });
  let who = undefined;
  addEventListener("clv-account", ev => { const u = ev.detail.user, id = u ? u.id + ":" + !!u.teacher : null; if (id !== who) { who = id; load(); } });
  addEventListener("load", () => { const u = A() && A().user; who = u ? u.id + ":" + !!u.teacher : null; load(); });
})();
</script>
</body>
