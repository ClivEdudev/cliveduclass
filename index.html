<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClivEdu Class · My lessons</title>
<meta name="theme-color" content="#FFFFFF">
<style>
/* Student home. Light and plain so it opens fast on any phone and reads well in daylight.
   Three jobs, in order: join today's class game, open today's lesson, revise older lessons. */
:root{
  --pg:#EEF3F8; --card:#FFFFFF; --ink:#12263A; --sub:#4B5F73; --line:#D2DCE6; --teal:#0B6E70;
  --yel:#FFC93C; --yelsoft:#FFF6D6; --blue:#1F5FD1; --green:#1C8F50; --greensoft:#E3F5EA;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--pg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
a{color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:9px}
.brand i{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 45deg,var(--blue) 0 25%,var(--teal) 0 50%,var(--blue) 0 75%,var(--teal) 0)}
.pts{background:var(--ink);color:#fff;border-radius:999px;padding:6px 14px;font-weight:800;white-space:nowrap}
.pts b{color:var(--yel);margin-left:4px;font-variant-numeric:tabular-nums}
.hello h1{font-size:clamp(30px,7vw,46px);line-height:1.1;font-weight:800;text-wrap:balance}
.hello p{color:var(--sub);margin-top:6px}
.hello .uz{color:var(--teal);font-weight:600;font-size:15px}

/* 1 · class game */
.game{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:22px;padding:16px 18px;text-decoration:none}
.game .ic{width:48px;height:48px;border-radius:14px;background:var(--yel);color:var(--ink);display:grid;place-items:center;font-size:24px;flex:none}
.game span.t{flex:1;min-width:0}
.game b{display:block;font-size:19px}
.game small{display:block;color:#BFD8D5;font-size:14px}
.game .go{font-weight:800;color:var(--yel);white-space:nowrap}
.game.live{background:var(--green)}
.game.live .ic{background:#fff}
.game.live small{color:#E3F5EA}
.game.live .go{color:#fff}

/* 2 · today */
.feature{background:var(--card);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--yel)}
.feature .eb{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#B45309}
.feature h2{font-size:clamp(26px,6vw,38px);line-height:1.1;font-weight:800;text-wrap:balance}
.feature .focus{color:var(--sub);font-weight:600}
.feature.locked{border-color:var(--line)}
.feature.locked .eb{color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:14px;font-weight:800;font-size:18px;text-decoration:none;background:var(--yel);color:var(--ink);align-self:flex-start}
.lock{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--pg);color:var(--sub);font-weight:800;align-self:flex-start}

/* 3 · revise */
.sec h2{font-size:22px;font-weight:800}
.sec > p{color:var(--sub);margin-top:2px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:12px}
.card{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;border:2px solid transparent;box-shadow:0 1px 0 var(--line)}
a.card:active,a.card:hover{border-color:var(--ink)}
.card .n{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.card h3{font-size:20px;line-height:1.2;font-weight:800}
.card .f{color:var(--sub);font-size:14px}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px;font-size:14px;font-weight:800}
.card .go{color:var(--blue)}
.card .my{color:var(--sub)}
.card.new{border-color:var(--yel);background:var(--yelsoft)}
.empty{background:var(--card);border-radius:18px;padding:18px;color:var(--sub)}
.foot-link{color:var(--sub);font-size:14px;text-align:center}
a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="lessons/plan.js"></script>
<script src="lessons/live-net.js"></script>
<script>
(() => {
  const P = window.PLAN;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const pts = P.points();
  const total = Object.values(pts).reduce((a, b) => a + (+b || 0), 0);
  const hh = String(P.unlockHour).padStart(2, "0");
  const items = [];
  const rev = P.revision, revDate = P.parse(rev.date);
  if (rev.openNow || P.isOpen(revDate)) items.push({ n: 0, title: rev.title, focus: "sentences · to be · questions · commands · may · must · have to", date: revDate, href: rev.path, key: "rev" });
  [[P.starter, "New group"], [P.extras, "Vocabulary"]].forEach(([list, label]) =>
    (list || []).forEach(s => { const d = P.parse(s.date); if (s.openNow || P.isOpen(d))
      items.push({ n: 0, group: s.group || label, title: s.title, focus: s.focus, date: d, href: s.path, key: s.key }); }));
  P.all.filter(l => l.ready && ((P.openNowLessons || []).includes(l.n) || P.isOpen(l.date))).forEach(l => items.push({ n: l.n, title: l.title, focus: l.focus, date: l.date, href: l.folder, key: String(l.n) }));
  items.sort((a, b) => b.date - a.date);
  const newest = items[0];
  const upcoming = P.all.find(l => !P.isOpen(l.date) && !(P.openNowLessons || []).includes(l.n));
  const isToday = it => it && P.key(it.date) === P.key(new Date());

  let feature = "";
  if (newest && (isToday(newest) || newest.date > new Date())) {   /* opened early counts as today */
    feature = `<section class="feature"><p class="eb">Today’s lesson · Bugungi dars</p>
      <h2>${esc(newest.title)}</h2><p class="focus">${esc(newest.focus)}</p>
      <a class="btn" href="${newest.href}">Open the lesson →</a></section>`;
  } else if (upcoming) {
    const at = P.openAt(upcoming.date);
    feature = `<section class="feature locked"><p class="eb">Next lesson · ${esc(P.fmt(upcoming.date))}</p>
      <h2>${esc(upcoming.title)}</h2><p class="focus">It opens here after class, at ${hh}:00 on ${esc(P.fmt(at))}. · Darsdan keyin ochiladi.</p>
      <span class="lock">🔒 Opens after class</span></section>`;
  }

  const cards = items.length ? items.map(it => `<a class="card ${isToday(it) ? "new" : ""}" href="${it.href}">
      <span class="n">${it.n ? "Lesson " + it.n : (it.group || "Revision")} · ${esc(P.fmt(it.date))}</span>
      <h3>${esc(it.title)}</h3><span class="f">${esc(it.focus)}</span>
      <span class="foot"><span class="my">My points: ${pts[it.key] || 0}</span><span class="go">Revise →</span></span></a>`).join("")
    : `<p class="empty">Your lessons will appear here after class.</p>`;

  document.getElementById("app").innerHTML = `
    <div class="top"><div class="brand"><i aria-hidden="true"></i>ClivEdu Class</div><span class="pts">⭐ My points <b>${total}</b></span></div>
    <div class="hello"><h1>My English <span>lessons</span></h1>
      <p>Every lesson from class is here: rules, Uzbek examples, quizzes and games.</p>
      <p class="uz">Har bir dars shu yerda. Takrorlang va ball yig‘ing!</p></div>
    <div id="liveBanner"><a class="game" href="play/"><span class="ic" aria-hidden="true">🎮</span><span class="t"><b>Join the class game</b><small>Get the code from the board · Kodni doskadan oling</small></span><span class="go">Join →</span></a></div>
    ${feature}
    <section class="sec"><h2>Revise my lessons</h2><p>${items.length} open · newest first · Darslarni takrorlang</p><div class="grid">${cards}</div></section>
    <p class="foot-link"><a href="teacher/">Teacher</a></p>`;
  if (window.LiveNet) {
    const stop = window.LiveNet.watchRooms(list => {
      const el = document.getElementById("liveBanner"); if (!el) return;
      el.innerHTML = list.length
        ? `<a class="game live" href="play/?code=${encodeURIComponent(list[0].code)}"><span class="ic" aria-hidden="true">🎮</span><span class="t"><b>A class game is on now!</b><small>${esc(list[0].set || "")} · code ${esc(list[0].code)} · Hozir o‘yin bor!</small></span><span class="go">Join →</span></a>`
        : `<a class="game" href="play/"><span class="ic" aria-hidden="true">🎮</span><span class="t"><b>Join the class game</b><small>Get the code from the board · Kodni doskadan oling</small></span><span class="go">Join →</span></a>`;
    });
    setTimeout(stop, 10 * 60000);
  }
})();
</script>
</body>
</html>
