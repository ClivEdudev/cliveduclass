<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/brand/icon-48.png">
<link rel="apple-touch-icon" href="/brand/icon-180.png">
<link rel="manifest" href="/brand/site.webmanifest">
<meta property="og:image" content="https://clivedu.me/brand/logo.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClivEdu Class · My lessons</title>
<meta name="theme-color" content="#F3F6FC">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
/* Student home, new look: Samarkand tilework. The level medallion (an 8-point star whose petals fill up)
   is the one big thing; everything else stays calm. Order on a phone: who I am and my level,
   when class is, today's lesson, the four things to do, my lesson journey, my badges. */
:root{
  --pg:#F3F6FC;--card:#FFFFFF;--ink:#101A45;--sub:#56608A;--line:#DCE2F2;
  --lapis:#2338A8;--lapis-d:#16206B;--turq:#13A3B0;--saff:#F4A91D;--pom:#D23B55;--green:#138A6B;
  --soft:#EAF0FB;--teal:#0E8792;
  --head:"Unbounded","Rubik",system-ui,sans-serif;--body:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --sh:0 1px 0 rgba(16,26,69,.06),0 12px 30px -16px rgba(16,26,69,.30);
  color-scheme:light;
}
html[data-theme="dark"]{--pg:#0A1030;--card:#131C4A;--ink:#EEF1FF;--sub:#A9B3DB;--line:#27326C;--soft:#1A2558;--teal:#5FD6DF;--green:#4CD3A8;
  --sh:0 1px 0 rgba(255,255,255,.04),0 16px 36px -18px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--pg);color:var(--ink);font:17px/1.45 var(--body);touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
a{color:inherit}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;zoom:var(--clv-scale,1)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--saff);outline-offset:3px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.brand{font:700 17px/1 var(--head);display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.brand i{width:30px;height:30px;border-radius:9px;flex:none}
.topr{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:7px 13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.chip img{width:26px;height:26px;border-radius:50%;object-fit:cover;margin:-4px 0 -4px -7px}
.chip.tg{background:#229ED9;border-color:#229ED9;color:#fff}
.chip.icon{padding:7px 10px}

/* layout: one column on phones, two on wide screens */
.grid2{display:grid;gap:16px}
.colL,.colR{display:grid;gap:16px;align-content:start;min-width:0}
@media (min-width:900px){.grid2{grid-template-columns:1.15fr .85fr;gap:20px}.colL,.colR{gap:20px}}

/* hero: who I am + the level medallion */
.hero{position:relative;overflow:hidden;border-radius:30px;padding:22px;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,#3550D6 0%,transparent 55%),linear-gradient(150deg,#2338A8 0%,#16206B 100%);
  box-shadow:0 22px 50px -24px rgba(22,32,107,.8);isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:url(/brand/tiles-dark.svg) 0 0/96px 96px;opacity:.9;z-index:-1;
  -webkit-mask-image:linear-gradient(110deg,transparent 30%,#000 90%);mask-image:linear-gradient(110deg,transparent 30%,#000 90%)}
.hero .hi{font:600 15px var(--body);color:#C9D3FF}
.hero h1{font:700 clamp(28px,7.4vw,44px)/1.04 var(--head);letter-spacing:-.02em;margin-top:4px;overflow-wrap:anywhere}
.hero .row{display:flex;align-items:center;gap:18px;margin-top:18px}
.medal{flex:none;width:clamp(120px,34vw,168px);height:auto;overflow:visible;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.medal .pet{fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.35);stroke-width:.6;transition:fill .4s}
.medal .pet.on{fill:var(--saff);stroke:#FFE2A6;animation:petal .5s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(.25s + var(--i) * .09s)}
.medal .pet.on:nth-child(even){fill:#FFC54D}
.medal .core{fill:#101A45;stroke:#FFE2A6;stroke-width:1.2}
.medal .lv{fill:#fff;font:700 17px var(--head);text-anchor:middle}
.medal .lvl{fill:#C9D3FF;font:600 6.4px var(--body);text-anchor:middle;letter-spacing:.06em}
@keyframes petal{from{fill:rgba(255,255,255,.14);transform:scale(.7);transform-origin:50px 50px}to{transform:none}}
.lvinfo{min-width:0;display:grid;gap:8px}
.lvinfo .nm{font:700 clamp(18px,4.6vw,24px)/1.15 var(--head)}
.lvinfo .nm small{display:block;font:500 14px var(--body);color:#C9D3FF;margin-top:3px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#F4A91D,#FFD27A);width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1) .3s}
.lvinfo .ptl{font-size:14px;color:#DCE3FF}
.lvinfo .ptl b{color:#fff;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 11px;font-weight:600;font-size:14px}
@media (max-width:420px){.hero{padding:18px}.hero .row{gap:12px}}

/* countdown to class */
.clock{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px 18px;box-shadow:var(--sh);border:1.5px solid var(--line)}
.clock .ico{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:22px;flex:none}
.clock .t{flex:1;min-width:0}
.clock b{display:block;font-weight:700}
.clock small{display:block;color:var(--sub);font-size:14px}
.clock .num{font:700 clamp(18px,5vw,24px) var(--head);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--lapis)}
html[data-theme="dark"] .clock .num{color:#FFC54D}
.clock.live{background:#E2F6EF;border-color:#9ADCC4}
.clock.live .num{color:var(--green)}
html[data-theme="dark"] .clock.live{background:#0F3A33;border-color:#1F6B5B}
.dot{width:10px;height:10px;border-radius:50%;background:#18B486;box-shadow:0 0 0 0 rgba(24,180,134,.6);animation:ping 1.6s infinite;display:inline-block;margin-right:6px}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(24,180,134,0)}100%{box-shadow:0 0 0 0 rgba(24,180,134,0)}}

/* today's lesson */
.today{position:relative;overflow:hidden;background:var(--card);border-radius:30px;padding:22px;box-shadow:var(--sh);border:2px solid var(--saff);display:grid;gap:12px}
.today::after{content:"";position:absolute;right:-48px;top:-48px;width:170px;height:170px;background:url(/brand/star.svg) center/contain no-repeat;opacity:.16;pointer-events:none}
.today .when{font-weight:700;color:#B26B00;font-size:15px}
html[data-theme="dark"] .today .when{color:#FFC54D}
.today h2{font:700 clamp(24px,6vw,36px)/1.1 var(--head);letter-spacing:-.02em;max-width:22ch}
.today .focus{color:var(--sub);max-width:52ch}
.today.locked{border-color:var(--line)}
html[data-theme="dark"] .today::after{opacity:.07}
/* next badge to win */
.goal{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:24px;padding:16px 18px;box-shadow:var(--sh);border:1.5px dashed var(--saff)}
.goal .i{width:58px;height:58px;flex:none;display:grid;place-items:center;font-size:27px;background:url(/brand/star.svg) center/contain no-repeat;filter:grayscale(.2)}
.goal p{color:var(--sub);font-size:14.5px}.goal b{display:block;font:700 16px var(--head);color:var(--ink);margin-bottom:2px}
.today.locked .when{color:var(--sub)}
.cta{display:inline-flex;align-items:center;gap:10px;justify-self:start;background:var(--saff);color:#101A45;font-weight:700;font-size:18px;text-decoration:none;
  padding:14px 22px;border-radius:16px;box-shadow:0 8px 20px -10px rgba(180,110,0,.8);transition:transform .15s}
.cta:active{transform:scale(.97)}
.lock{justify-self:start;display:inline-flex;gap:8px;align-items:center;font-weight:600;background:var(--soft);color:var(--sub);padding:10px 16px;border-radius:14px}

/* four things to do */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;overflow:hidden;border-radius:24px;padding:16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  text-decoration:none;color:#fff;box-shadow:var(--sh);isolation:isolate;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile::before{content:"";position:absolute;right:-26px;bottom:-26px;width:110px;height:110px;background:url(/brand/star.svg) center/contain no-repeat;opacity:.22;z-index:-1;
  filter:brightness(0) invert(1)}
.tile .em{font-size:28px;line-height:1}
.tile b{display:block;font:700 17px/1.15 var(--head)}
.tile small{display:block;font-size:13.5px;opacity:.92;margin-top:3px}
.tile.game{background:linear-gradient(150deg,#2B44C2,#16206B)}
.tile.daily{background:linear-gradient(150deg,#F4A91D,#D9780B);color:#101A45}
.tile.daily::before{filter:none;opacity:.25}
.tile.solo{background:linear-gradient(150deg,#13A3B0,#0B6F86)}
.tile.words{background:linear-gradient(150deg,#E2506A,#A8213F)}
.tile.live{background:linear-gradient(150deg,#18B486,#0C7A5B);animation:liveglow 2s ease-in-out infinite}
@keyframes liveglow{50%{box-shadow:0 0 0 6px rgba(24,180,134,.25),var(--sh)}}
.tile .badge{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.2);border-radius:999px;padding:3px 9px;font-weight:700;font-size:13px}
.tile.daily .badge{background:rgba(255,255,255,.55)}

/* group, sign in */
.grppick{background:var(--card);border:2px solid var(--lapis);border-radius:24px;padding:18px;display:grid;gap:8px;box-shadow:var(--sh)}
.grppick h2{font:700 20px var(--head)}
.uz{color:var(--teal);font-weight:500;font-size:15px}
.grpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:10px;margin-top:4px}
.grpbtn{text-align:left;cursor:pointer;border:2px solid var(--line);background:var(--soft);border-radius:18px;padding:14px 16px;display:grid;gap:2px}
.grpbtn:hover,.grpbtn:focus-visible{border-color:var(--lapis)}
.grpbtn b{font:700 18px var(--head)}.grpbtn span{font-weight:600;color:var(--lapis)}.grpbtn small{color:var(--sub);font-size:14px}
html[data-theme="dark"] .grpbtn span{color:#93A8FF}
.signcard{display:flex;align-items:center;gap:14px;background:#229ED9;color:#fff;border-radius:24px;padding:16px 18px;border:0;width:100%;text-align:left;cursor:pointer;box-shadow:var(--sh)}
.signcard .ic{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px;flex:none}
.signcard .t{flex:1;min-width:0}.signcard b{display:block;font:700 17px var(--head)}.signcard small{display:block;color:#E4F4FC;font-size:14px}

/* section heads */
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:34px 0 14px}
.sh h2{font:700 clamp(22px,5vw,30px)/1.1 var(--head);letter-spacing:-.02em}
.sh p{color:var(--sub);font-size:15px;margin-top:4px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:3px}
.seg button{border:0;background:none;border-radius:11px;padding:7px 12px;font-weight:600;cursor:pointer;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--pg)}
.search{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 14px;font:inherit;font-size:16px;color:var(--ink);width:min(260px,100%)}
.search::placeholder{color:var(--sub)}

/* journey: the lessons as stops on a road, newest at the top */
.road{position:relative;display:grid;gap:14px;padding-left:34px;align-items:start}
.road::before{content:"";position:absolute;left:13px;top:10px;bottom:10px;width:4px;border-radius:4px;
  background:repeating-linear-gradient(180deg,var(--saff) 0 12px,transparent 12px 22px)}
.stop{position:relative;display:block;text-decoration:none;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:var(--sh);border:1.5px solid var(--line)}
.stop::before{content:"";position:absolute;left:-34px;top:16px;width:30px;height:30px;background:url(/brand/star.svg) center/contain no-repeat;filter:grayscale(1) opacity(.45)}
.stop.got::before{filter:none}
.stop.here{border-color:var(--saff);border-width:2px}
.stop.here::after{content:"You are here";position:absolute;right:14px;top:-11px;background:var(--saff);color:#101A45;font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px}
.stop .k{font-size:13px;font-weight:600;color:var(--teal)}
.stop h3{font:700 18px/1.2 var(--head);margin-top:3px}
.stop .f{color:var(--sub);font-size:14px;margin-top:3px}
.stop .ft{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:14px;font-weight:600}
.stop .ft .p{color:var(--sub)}
.stop .ft .go{color:var(--lapis)}
html[data-theme="dark"] .stop .ft .go{color:#93A8FF}
@media (min-width:760px){
  .road{padding-left:0;grid-template-columns:1fr 1fr;column-gap:64px}
  .road::before{left:calc(50% - 2px)}
  .stop:nth-child(odd){grid-column:1}.stop:nth-child(even){grid-column:2;margin-top:44px}
  .stop:nth-child(odd)::before{left:auto;right:-49px}.stop:nth-child(even)::before{left:-49px}
}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:12px}
.list .stop::before{display:none}
.empty{background:var(--card);border-radius:22px;padding:18px;color:var(--sub);box-shadow:var(--sh)}

/* badges */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.bdg{background:var(--card);border-radius:20px;padding:12px 8px;text-align:center;box-shadow:var(--sh);border:1.5px solid var(--line);cursor:pointer;display:grid;gap:4px;justify-items:center}
.bdg .i{width:54px;height:54px;display:grid;place-items:center;font-size:26px;background:url(/brand/star.svg) center/contain no-repeat}
.bdg b{font-size:13px;line-height:1.2}
.bdg.no{opacity:.55}.bdg.no .i{filter:grayscale(1);opacity:.6}
.bdg[aria-expanded="true"]{border-color:var(--lapis)}
.tip{grid-column:1/-1;background:var(--ink);color:var(--pg);border-radius:16px;padding:10px 14px;font-size:15px}

.foot{display:flex;justify-content:center;gap:18px;margin-top:38px;color:var(--sub);font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#101A45;color:#fff;border-radius:18px;padding:14px 20px;font-weight:600;
  box-shadow:0 20px 40px -16px rgba(0,0,0,.6);z-index:50;text-align:center;max-width:calc(100% - 32px)}
.toast b{color:#FFC54D;font-family:var(--head)}
@media (max-width:380px){.tile{min-height:120px;padding:14px}.tile b{font-size:15.5px}}
@media (max-width:440px){.chip .lbl{display:none}}

/* ---------- motion (lessons/motion.js decides full / light / off) ---------- */
.hero .bigstar{position:absolute;right:-90px;top:-90px;width:300px;height:300px;z-index:-1;opacity:.13;background:url(/brand/star.svg) center/contain no-repeat;filter:brightness(0) invert(1)}
html.nv-full .hero .bigstar{animation:nvSpin 50s linear infinite}
html.nv-on .hero .wd{display:inline-block;animation:wdUp .8s cubic-bezier(.2,.9,.25,1.2) both;animation-delay:calc(.15s + var(--w) * .09s)}
@keyframes wdUp{from{opacity:0;transform:translateY(.6em) rotate(4deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.mwrap{position:relative;flex:none;display:grid;place-items:center}
.mwrap .medal{position:relative;z-index:1}
.orbit{position:absolute;inset:-9%;width:118%;height:118%;pointer-events:none;overflow:visible}
.orbit circle:first-child{fill:none;stroke:rgba(255,226,166,.35);stroke-width:.5;stroke-dasharray:1.5 3}
.orbit .sp circle{fill:#FFE2A6;filter:drop-shadow(0 0 2px #FFC54D)}
html.nv-full .orbit{animation:nvSpin 18s linear infinite}
html.nv-full .orbit .sp{animation:twk 2.4s ease-in-out infinite alternate}
@keyframes twk{to{opacity:.35}}
html.nv-on .medal{animation:medIn 1s cubic-bezier(.2,.9,.25,1.25) both .1s}
@keyframes medIn{from{transform:scale(.3) rotate(-120deg);opacity:0}to{transform:none;opacity:1}}
html.nv-full .medal .core{animation:corePulse 3s ease-in-out infinite}
@keyframes corePulse{50%{stroke-width:2.4}}
.cta .arr{display:inline-block;transition:transform .25s}
.cta:hover .arr{transform:translateX(5px)}
html.nv-full .cta .arr{animation:arrNudge 1.6s ease-in-out infinite}
@keyframes arrNudge{50%{transform:translateX(5px)}}
html.nv-on .tile.rvd,html.nv-on .stop.rvd,html.nv-on .bdg.rvd,html.nv-on .goal.rvd,html.nv-on .clock.rvd{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .2s}
html.nv-on .stop.rvd:hover{transform:translateY(-4px);box-shadow:0 20px 40px -20px rgba(16,26,69,.45)}
html.nv-on .stop.in:hover::before{transform:rotate(45deg) scale(1.15)}
.stop::before{transition:transform .5s cubic-bezier(.2,.9,.3,1.4),filter .3s}
html.nv-on .stop.got.in::before{animation:nodePop .7s cubic-bezier(.2,.9,.3,1.5) both .25s}
@keyframes nodePop{from{transform:scale(0) rotate(-180deg)}to{transform:none}}
html.nv-full .stop.here{animation:hereGlow 2.6s ease-in-out infinite}
@keyframes hereGlow{50%{box-shadow:0 0 0 6px rgba(244,169,29,.22),var(--sh)}}
html.nv-full .road::before{animation:march 1.2s linear infinite}
@keyframes march{to{background-position:0 22px}}
#camel{position:absolute;left:1px;top:0;font-size:30px;z-index:2;transition:top .25s linear;transform:scaleX(-1);filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));pointer-events:none}
#camel.walk{animation:camelStep .5s ease-in-out infinite}
@keyframes camelStep{50%{transform:scaleX(-1) translateY(-3px) rotate(-4deg)}}
@media (min-width:760px){#camel{left:calc(50% - 17px)}}
html.nv-on .bdg.rvd:hover{transform:translateY(-4px) rotate(-2deg)}
html.nv-on .bdg[aria-expanded="true"] .i{animation:bdgSpin .7s cubic-bezier(.2,.9,.3,1.3)}
@keyframes bdgSpin{from{transform:rotateY(0) scale(1)}50%{transform:rotateY(180deg) scale(1.25)}to{transform:rotateY(360deg) scale(1)}}
html.nv-full .bdg:not(.no) .i{animation:bdgFloat 4s ease-in-out infinite;animation-delay:var(--sd,0s)}
@keyframes bdgFloat{50%{transform:translateY(-3px) rotate(8deg)}}
html.nv-on .tip{animation:tipIn .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes tipIn{from{opacity:0;transform:translateY(-8px) scale(.97)}}
html.nv-full .tile.live .em{animation:liveBounce .9s ease-in-out infinite}
@keyframes liveBounce{50%{transform:scale(1.2) rotate(-8deg)}}
html.nv-full .clock .ico{animation:hour 4s ease-in-out infinite}
@keyframes hour{0%,40%{transform:rotate(0)}50%,90%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
html.nv-on .toast{animation:toastIn .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,30px) scale(.9)}}
/* word ribbon */
.ribbon{margin:38px -16px 0;display:grid;gap:8px;overflow:hidden;transform:rotate(-2deg);padding:8px 0}
.rb{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.rbt{display:flex;gap:10px;width:max-content}
html.nv-full .r1 .rbt{animation:rib 38s linear infinite}
html.nv-full .r2 .rbt{animation:rib 44s linear infinite reverse}
html.nv-light .r1 .rbt{animation:rib 70s linear infinite}
@keyframes rib{to{transform:translateX(-50%)}}
.rw{display:inline-flex;align-items:baseline;gap:8px;border-radius:999px;padding:8px 16px;white-space:nowrap;color:#fff}
.rw b{font:700 16px var(--head)}.rw i{font-style:normal;opacity:.85;font-size:14px}
.rw.c0{background:#2338A8}.rw.c1{background:#13A3B0}.rw.c2{background:#F4A91D;color:#101A45}.rw.c3{background:#D23B55}
.r2 .rw{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.r2 .rw i{color:var(--teal)}
@media (min-width:1150px){.ribbon{margin-left:calc((1120px - 100vw) / 2);margin-right:calc((1120px - 100vw) / 2)}}
</style>
<script src="lessons/settings.js"></script>
<script src="lessons/account.js" defer></script>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="lessons/plan.js"></script>
<script src="lessons/live-net.js"></script>
<script src="lessons/progress.js"></script>
<script>
(() => {
  const P = window.PLAN, PR = window.CLV_PROGRESS;
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pts = P.points();

  /* Two groups: A · Elementary (lessons/NN/) and B · Beginner (start/01/ + beginner/NN/).
     The student picks a group once; it is saved on the phone and, when signed in, on the server. */
  const acct = () => window.CLV_ACCOUNT && window.CLV_ACCOUNT.user;
  let grp = P.groupOf() || (acct() && acct().group) || "";
  const BEG = P.beginner, isB = grp === "b";
  const HOUR = isB ? BEG.unlockHour : P.unlockHour, hh = P.hm(HOUR);
  const items = [];
  if (isB) {
    BEG.all.filter(l => l.ready && (l.done || P.isForced(l.id) || P.isOpen(l.date, BEG.unlockHour)))
      .forEach(l => items.push({ n: l.n, beg: true, title: l.title, focus: l.focus, date: l.date, href: l.folder, key: l.id }));
  } else {
    const rev = P.revision, revDate = P.parse(rev.date);
    if (rev.openNow || P.isOpen(revDate)) items.push({ n: 0, group: "Revision", title: rev.title, focus: "sentences · to be · questions · commands · may · must · have to", date: revDate, href: rev.path, key: "rev" });
    (P.extras || []).forEach(s => { const d = P.parse(s.date); if (s.openNow || P.isForced(s.key) || P.isOpen(d, s.openHour))
      items.push({ n: 0, group: s.group || "Vocabulary", title: s.title, focus: s.focus, date: d, href: s.path, key: s.key, pri: s.pri || 0 }); });
    P.all.filter(l => l.ready && ((P.openNowLessons || []).includes(l.n) || P.isForced(l.n) || P.isOpen(l.date))).forEach(l => items.push({ n: l.n, title: l.title, focus: l.focus, date: l.date, href: l.folder, key: String(l.n) }));
  }
  items.sort((a, b) => (b.date - a.date) || ((b.pri || 0) - (a.pri || 0)));
  const newest = items[0];
  const upcoming = isB ? BEG.all.find(l => !l.done && !P.isOpen(l.date, BEG.unlockHour) && !P.isForced(l.id))
    : P.all.find(l => !P.isOpen(l.date) && !(P.openNowLessons || []).includes(l.n) && !P.isForced(l.n));
  addEventListener("clv-open", e => P.reloadForOpen(e.detail || []));          /* the teacher opened a lesson from Telegram */
  const isToday = it => it && P.key(it.date) === P.key(new Date());
  const G = id => (P.groups || []).find(x => x.id === id) || {};

  /* ---------- pieces ---------- */
  const todayLesson = newest && (isToday(newest) || newest.date > new Date()) ? newest : null;
  function todayCard() {
    if (todayLesson) return `<section class="today" data-tilt="4" data-rv="up" style="--d:2"><p class="when">Today’s lesson · Bugungi dars</p>
      <h2>${esc(todayLesson.title)}</h2><p class="focus">${esc(todayLesson.focus)}</p>
      <a class="cta nv-shine" data-mag href="${todayLesson.href}">Open the lesson <span class="arr" aria-hidden="true">➜</span></a></section>`;
    if (upcoming) { const at = P.openAt(upcoming.date, isB ? BEG.unlockHour : null);
      return `<section class="today locked" data-rv="up" style="--d:2"><p class="when">Next lesson · ${esc(P.fmt(upcoming.date))}, ${hh}</p>
      <h2>${esc(upcoming.title)}</h2><p class="focus">It opens here when class starts, at ${hh} on ${esc(P.fmt(at))}. Dars boshlanganda ochiladi.</p>
      <span class="lock">🔒 Opens when class starts</span></section>`; }
    return "";
  }
  /* class clock: "class is on now" for 90 minutes after the start, otherwise a countdown to the next class */
  const CLASS_MIN = 90;
  function classTimes() {
    const now = Date.now();
    const todays = (isB ? BEG.all : P.all).find(l => isToday(l));            /* a class day, even before its lesson is built */
    if (todays) { const s = P.openAt(todays.date, HOUR).getTime(); if (now >= s && now < s + CLASS_MIN * 60e3) return { live: true, end: s + CLASS_MIN * 60e3 }; }
    if (upcoming) return { live: false, start: P.openAt(upcoming.date, HOUR).getTime(), date: upcoming.date };
    return null;
  }
  const two = n => String(n).padStart(2, "0");
  function clockHTML() {
    const c = classTimes(); if (!c || !grp) return "";
    if (c.live) return `<div class="clock live" id="clock" data-rv="up" style="--d:1"><span class="ico">🏫</span><span class="t"><b><span class="dot"></span>Class is on now</b><small>Hozir dars bor · follow the board</small></span><span class="num" data-cd="${c.end}"></span></div>`;
    return `<div class="clock" id="clock" data-rv="up" style="--d:1"><span class="ico">⏳</span><span class="t"><b>Next class</b><small>${esc(P.fmt(c.date))} · ${hh} · Keyingi dars</small></span><span class="num" data-cd="${c.start}"></span></div>`;
  }
  function tick() {
    document.querySelectorAll("[data-cd]").forEach(el => {
      let ms = Math.max(0, +el.dataset.cd - Date.now()); if (!ms) { location.reload(); return; }
      const d = Math.floor(ms / 864e5); ms -= d * 864e5; const h = Math.floor(ms / 36e5); ms -= h * 36e5; const m = Math.floor(ms / 6e4); const s = Math.floor((ms - m * 6e4) / 1e3);
      const txt = (el.closest(".live") ? "ends in " : "") + (d ? d + "d " : "") + (d || h ? two(h) + ":" : "") + two(m) + ":" + two(s);
      if (el.dataset.txt === txt) return;
      const old = el.dataset.txt || "";
      if (old.length !== txt.length) el.innerHTML = txt.split("").map(ch => /\d/.test(ch) ? `<span class="nv-dg"><b>${ch}</b></span>` : `<span>${ch}</span>`).join("");
      else [...el.children].forEach((sp, i) => { if (old[i] !== txt[i]) { sp.classList.remove("roll"); void sp.offsetWidth; sp.firstChild ? (sp.firstChild.textContent = txt[i]) : (sp.textContent = txt[i]); sp.classList.add("roll"); } });
      el.dataset.txt = txt; el.setAttribute("aria-label", txt);
    });
  }

  function groupBox() {
    if (grp) return "";
    return `<section class="grppick" data-rv="up"><h2>Which group are you in?</h2><p class="uz">Qaysi guruhdasiz? Dars kunlari va vaqtiga qarang.</p>
      <div class="grpgrid">${(P.groups || []).map(x => `<button class="grpbtn" data-group="${x.id}"><b>${esc(x.name)}</b><span>${esc(x.when)}</span><small>${esc(x.uz)}</small></button>`).join("")}</div></section>`;
  }
  function setGroup(g) {
    P.setGroup(g);
    const A = window.CLV_ACCOUNT;
    if (A && A.signedIn && A.user && A.user.group !== g) A.api("/profile", { body: { group: g } }).then(j => { if (j && j.user) A.setUser(j.user); }).catch(() => {}).then(() => location.reload());
    else location.reload();
  }

  function dailyInfo() {
    let D = {}; try { D = JSON.parse(localStorage.getItem("clv-daily") || "{}"); } catch (e) {}
    const k = t => new Date(t + 5 * 3600e3).toISOString().slice(0, 10);
    return D[k(Date.now())];
  }
  function tiles(live) {
    const S = PR.stats(), d = dailyInfo();
    const game = live
      ? `<a class="tile live nv-shine" data-tilt="10" data-rv="pop" style="--d:1" href="play/?code=${encodeURIComponent(live.code)}"><span class="badge">LIVE</span><span class="em nv-bob">🎮</span><span><b>Game on now!</b><small>Code ${esc(live.code)} · Hozir o‘yin bor</small></span></a>`
      : `<a class="tile game nv-shine" data-tilt="10" data-rv="pop" style="--d:1" href="play/"><span class="em nv-bob">🎮</span><span><b>Class game</b><small>Code from the board · Kodni oling</small></span></a>`;
    return `<div class="tiles" id="tiles">${game}
      <a class="tile daily nv-shine" data-tilt="10" data-rv="pop" style="--d:2;--sd:2s" href="daily/">${S.streak ? `<span class="badge">🔥 ${S.streak}</span>` : ""}<span class="em nv-bob">${d ? "✅" : "📅"}</span><span><b>${d ? "Daily done!" : "Daily challenge"}</b><small>${d ? "Come back tomorrow · Ertaga" : "2 minutes · Kunlik sinov"}</small></span></a>
      <a class="tile solo nv-shine" data-tilt="10" data-rv="pop" style="--d:3;--sd:3s" href="play/?solo=1"><span class="em nv-bob">🧑‍🎓</span><span><b>Practice</b><small>Play by yourself · Yakka o‘ynash</small></span></a>
      <a class="tile words nv-shine" data-tilt="10" data-rv="pop" style="--d:4;--sd:4s" href="words/">${S.words ? `<span class="badge">${S.known}/${S.words}</span>` : ""}<span class="em nv-bob">🃏</span><span><b>Word bank</b><small>Flashcards · So‘z kartalari</small></span></a></div>`;
  }
  function hero() {
    const S = PR.stats(), u = acct(), first = u && u.name ? String(u.name).split(" ")[0] : "";
    const hour = new Date().getHours(), hi = hour < 12 ? "Good morning · Xayrli tong" : hour < 18 ? "Good afternoon · Xayrli kun" : "Good evening · Xayrli kech";
    const title = first ? "Salom, " + first + "!" : "My English lessons";
    return `<section class="hero nv-shine" id="hero" data-tilt="5" data-rv="zoom"><span class="bigstar" aria-hidden="true"></span><p class="hi">${hi}</p>
      <h1 aria-label="${esc(title)}">${title.split(" ").map((w, i) => `<span class="wd" style="--w:${i}" aria-hidden="true">${esc(w)}</span>`).join(" ")}</h1>
      <div class="row"><span class="mwrap"><svg class="orbit" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="49" /><g class="sp"><circle cx="50" cy="1" r="2.2"/><circle cx="99" cy="50" r="1.5"/><circle cx="50" cy="99" r="1.8"/><circle cx="1" cy="50" r="1.3"/></g></svg>${PR.medallion(S)}</span>
        <div class="lvinfo"><p class="nm">${esc(S.name)}<small>${esc(S.nameUz)} · level ${S.level}</small></p>
          <div class="bar" aria-hidden="true"><i data-w="${Math.round(100 * S.into / Math.max(1, S.need))}%"></i></div>
          <p class="ptl"><b data-count="${S.total}">${S.total}</b> points · <b>${S.next - S.total}</b> to level ${S.level + 1}</p>
          <div class="stats"><span class="stat">🔥 ${S.streak} ${S.streak === 1 ? "day" : "days"}</span><span class="stat">🏅 ${S.badges.filter(b => b.got).length}/${S.badges.length}</span>${S.known ? `<span class="stat">🃏 ${S.known} words</span>` : ""}</div></div></div></section>`;
  }

  let view = "road", q = "";
  try { view = localStorage.getItem("clv-homeview") || "road"; } catch (e) {}
  function lessons() {
    const k = q.trim().toLowerCase();
    const list = items.filter(it => !k || (it.title + " " + it.focus + " " + (it.n || "")).toLowerCase().includes(k));
    if (!items.length) return `<p class="empty">Your lessons appear here when class starts. Darslar dars boshlanganda shu yerda paydo bo‘ladi.</p>`;
    if (!list.length) return `<p class="empty">No lesson matches “${esc(q)}”. Try another word.</p>`;
    return `<div class="${view === "list" ? "list" : "road"}">${list.map((it, i) => `<a class="stop ${pts[it.key] ? "got" : ""} ${i === 0 && !k ? "here" : ""}" href="${it.href}" data-rv="${view === "list" ? "up" : i % 2 ? "right" : "left"}" style="--d:${view === "list" ? i % 3 : 0}">
      <span class="k">${it.n ? (it.beg ? "Beginner " : "") + "Lesson " + it.n : esc(it.group || "Extra")} · ${esc(P.fmt(it.date))}</span>
      <h3>${esc(it.title)}</h3><p class="f">${esc(it.focus)}</p>
      <span class="ft"><span class="p">⭐ ${pts[it.key] || 0} points</span><span class="go">Revise</span></span></a>`).join("")}</div>`;
  }
  /* a moving ribbon of words from the course, English and Uzbek, in two directions */
  const RIB = [["hello","salom"],["book","kitob"],["teacher","o‘qituvchi"],["friend","do‘st"],["bazaar","bozor"],["bread","non"],["tea","choy"],["city","shahar"],["morning","ertalab"],["happy","xursand"],
    ["family","oila"],["water","suv"],["school","maktab"],["kitchen","oshxona"],["summer","yoz"],["winter","qish"],["ticket","chipta"],["garden","bog‘"],["doctor","shifokor"],["children","bolalar"]];
  function ribbon() {
    const row = (list, cls) => `<div class="rb ${cls}"><div class="rbt">${[...list, ...list].map(([e, u], i) => `<span class="rw c${i % 4}"><b>${e}</b><i>${u}</i></span>`).join("")}</div></div>`;
    return `<div class="ribbon" aria-hidden="true">${row(RIB.slice(0, 10), "r1")}${row(RIB.slice(10), "r2")}</div>`;
  }
  function goal() {
    const S = PR.stats(), x = S.badges.find(b => !b.got);
    if (!x) return `<div class="goal" id="goal" data-rv="up" style="--d:5"><span class="i nv-bob">👑</span><p><b>Every badge won!</b>Siz barcha nishonlarni oldingiz.</p></div>`;
    return `<div class="goal" id="goal" data-rv="up" style="--d:5"><span class="i nv-bob">${x.icon}</span><p><b>Next badge: ${esc(x.en)}</b>${esc(x.how)}. · ${esc(x.uz)}</p></div>`;
  }
  function badges() {
    const S = PR.stats();
    return `<div class="shelf" id="shelf">${S.badges.map((b, i) => `<button class="bdg ${b.got ? "nv-shine" : "no"}" data-badge="${b.id}" aria-expanded="false" data-rv="flip" style="--d:${i % 6};--sd:${(i % 5) * .7 + 1}s"><span class="i">${b.icon}</span><b>${esc(b.en)}</b></button>`).join("")}</div>`;
  }

  /* ---------- page ---------- */
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="top"><div class="brand"><i aria-hidden="true"></i>ClivEdu Class</div><span class="topr"><a class="chip" href="https://clivesystems.netlify.app/" title="All Clive apps and your c-ID card" style="text-decoration:none">🪐 Clive orbit</a><span id="accBtn"></span><button class="chip icon" data-settings aria-label="Settings">⚙️</button></span></div>
    <div class="grid2">
      <div class="colL">${hero()}${clockHTML()}<div id="grpBox">${groupBox()}</div>${todayCard()}</div>
      <div class="colR"><div id="signBox"></div><div id="tileBox">${tiles(null)}</div>${goal()}</div>
    </div>
    ${ribbon()}
    <div class="sh" data-rv="up"><div><h2>My journey</h2><p>${items.length} lessons open${grp ? " · " + esc(G(grp).name) : ""} · Darslarni takrorlang</p></div>
      <div class="tools"><input class="search" id="q" type="search" placeholder="Find a lesson…" aria-label="Find a lesson">
      <div class="seg" role="group" aria-label="View"><button data-view="road" aria-pressed="${view === "road"}">Road</button><button data-view="list" aria-pressed="${view === "list"}">Grid</button></div></div></div>
    <div id="lessons">${lessons()}</div>
    <div class="sh" data-rv="up"><div><h2>My badges</h2><p>Tap a badge to see how to get it · Nishonlar</p></div></div>
    ${badges()}
    <p class="foot">${grp ? `<a href="#" data-pickgroup>Group: ${esc(G(grp).name)} · change</a>` : ""}<a href="teacher/">Teacher</a></p>`;

  requestAnimationFrame(() => setTimeout(() => document.querySelectorAll(".bar i").forEach(i => { i.style.width = i.dataset.w; }), 30));
  tick(); setInterval(tick, 1000);
  /* a camel walks down the lesson road as you scroll (full animations) */
  function camel() {
    const box = document.getElementById("lessons"), road = box && box.querySelector(".road");
    let c = document.getElementById("camel");
    if (!road || !document.documentElement.classList.contains("nv-full")) { if (c) c.remove(); return; }
    if (!c) { c = document.createElement("span"); c.id = "camel"; c.setAttribute("aria-hidden", "true"); c.textContent = "🐪"; }
    road.appendChild(c);
    const place = () => { const r = road.getBoundingClientRect(), k = Math.max(0, Math.min(1, (innerHeight * .55 - r.top) / Math.max(1, r.height)));
      c.style.top = (k * (r.height - 40)) + "px"; c.classList.toggle("walk", k > 0 && k < 1); };
    place(); if (!camel.on) { camel.on = 1; addEventListener("scroll", () => requestAnimationFrame(() => { const x = document.getElementById("camel"); if (x) camel.place(); }), { passive: true }); }
    camel.place = place;
  }
  const rescan = () => { if (window.CLV_MOTION) window.CLV_MOTION.scan(); camel(); };
  addEventListener("load", rescan); setTimeout(rescan, 400);

  document.addEventListener("click", e => {
    const g = e.target.closest("[data-group]"); if (g) { setGroup(g.dataset.group); return; }
    if (e.target.closest("[data-pickgroup]")) { e.preventDefault(); try { localStorage.removeItem("clv-group"); } catch (er) {} grp = ""; document.getElementById("grpBox").innerHTML = groupBox(); document.getElementById("grpBox").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    const v = e.target.closest("[data-view]"); if (v) { view = v.dataset.view; try { localStorage.setItem("clv-homeview", view); } catch (er) {} document.querySelectorAll("[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view))); document.getElementById("lessons").innerHTML = lessons(); rescan(); return; }
    const b = e.target.closest("[data-badge]"); if (b) {
      const shelf = document.getElementById("shelf"), old = shelf.querySelector(".tip"), open = b.getAttribute("aria-expanded") === "true";
      if (old) old.remove(); shelf.querySelectorAll("[data-badge]").forEach(x => x.setAttribute("aria-expanded", "false"));
      if (!open) { const x = PR.stats().badges.find(y => y.id === b.dataset.badge); b.setAttribute("aria-expanded", "true");
        const tip = document.createElement("p"); tip.className = "tip"; tip.innerHTML = `${x.icon} <b>${esc(x.en)}</b> · ${esc(x.uz)} — ${x.got ? "you have it! ✓" : esc(x.how) + "."}`;
        /* show the tip under the row of the tapped badge */
        const all = [...shelf.querySelectorAll("[data-badge]")], top = b.offsetTop; let last = b; all.forEach(y => { if (y.offsetTop === top) last = y; }); last.after(tip); }
    }
  });
  document.getElementById("q").addEventListener("input", e => { q = e.target.value; document.getElementById("lessons").innerHTML = lessons(); rescan(); });

  /* signed in: the group saved on the server wins on a new phone; a group picked here is sent to the server */
  addEventListener("clv-account", e => {
    const u = e.detail && e.detail.user; if (!u) return;
    const local = P.groupOf();
    if (!local && (u.group === "a" || u.group === "b")) { P.setGroup(u.group); if (u.group !== grp) location.reload(); }
    else if (local && u.group !== local && window.CLV_ACCOUNT && window.CLV_ACCOUNT.signedIn) window.CLV_ACCOUNT.api("/profile", { body: { group: local } }).then(j => { if (j && j.user) window.CLV_ACCOUNT.setUser(j.user); }).catch(() => {});
  });
  let lastLive = null;
  /* redraw a block only when its content really changed, so nothing plays its entrance twice */
  const last = {};
  function swap(id, html, inner) {
    if (last[id] === html) return; const first = last[id] === undefined; last[id] = html;
    const el = document.getElementById(id); if (!el) return;
    if (inner) el.innerHTML = html; else el.outerHTML = html;
    const now = document.getElementById(id);
    if (!first && now) { now.querySelectorAll("[data-rv]").forEach(x => x.classList.add("in", "rvd")); if (now.hasAttribute("data-rv")) now.classList.add("in", "rvd"); }
  }
  const acc = () => {
    const el = document.getElementById("accBtn"), u = acct(); if (!el) return;
    const face = u && /^[gbn]\d\d$/.test(u.avatar || "") ? `<img src="avatars/${u.avatar}.webp?v=2" alt="">` : "👤";
    el.innerHTML = u ? `<a class="chip" href="me/">${face}<span class="lbl">${esc(String(u.name || "Me").split(" ")[0])}</span></a>`
      : `<button class="chip tg" data-signin>✈️ <span>Sign in</span></button>`;
    swap("signBox", u ? "" : `<button class="signcard nv-shine" data-signin data-rv="up"><span class="ic" aria-hidden="true">✈️</span>
      <span class="t"><b>Sign in with Telegram</b><small>Keep your points and badges on every phone. Telegram orqali kiring: ballar saqlanadi.</small></span></button>`, true);
    const hh = hero(); if (last.hero !== hh) { swap("hero", hh); requestAnimationFrame(() => setTimeout(() => document.querySelectorAll(".bar i").forEach(i => { i.style.width = i.dataset.w; }), 30)); }
    swap("tileBox", tiles(lastLive), true);
    swap("shelf", badges());
    swap("goal", goal());
    levelUp(); rescan();
  };
  function levelUp() {
    PR.celebrate(PR.stats(), s => {
      const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
      t.innerHTML = `⭐ Level up! You are now <b>level ${s.level} · ${esc(s.name)}</b>`; document.body.appendChild(t); setTimeout(() => t.remove(), 4500);
    });
  }
  addEventListener("clv-account", acc); addEventListener("load", acc); acc();
  if (window.LiveNet) {
    const stop = window.LiveNet.watchRooms(list => { lastLive = list[0] || null; swap("tileBox", tiles(lastLive), true); rescan(); });
    setTimeout(stop, 10 * 60000);
  }
})();
</script>
</body>
</html>
