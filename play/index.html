<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1828">
<title>ClivEdu Live · Join</title>
<link rel="stylesheet" href="../lessons/live.css">
</head>
<body class="player">
<main id="app" class="pscreen"></main>
<script src="../lessons/live-net.js"></script>
<script>
(() => {
"use strict";
/* Built for low-end phones: system fonts, no animations, and the screen is only rebuilt when something the player sees changes. */
const NET = window.LiveNet, $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SH = ['<path d="M20 4 L37 34 L3 34 Z"/>','<path d="M20 2 L37 20 L20 38 L3 20 Z"/>','<circle cx="20" cy="20" r="16"/>','<rect x="5" y="5" width="30" height="30" rx="3"/>'];
const shape = i => `<svg class="shp" viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">${SH[i]}</svg>`;
const me = { id: null, name: "", type: "team", room: "" };
let client = null, st = null, gotAt = 0, lastKey = "", tick = 0, myChoice = null, built = [], sentFor = -1, connected = false;
const saved = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
const keep = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

function joinForm(err) {
  const last = saved("clv-live-last") || {};
  const qcode = (new URLSearchParams(location.search).get("code") || "").toUpperCase();
  app.innerHTML = `<div class="pcard">
    <p class="brand"><i></i>ClivEdu Live</p>
    <h1>Join the game</h1>
    <div class="proomwrap"><p class="strong">Games now</p><div id="rooms" class="proomlist"><p class="muted small">Looking for games…</p></div></div>
    <label for="code">Game code</label>
    <input id="code" inputmode="text" autocapitalize="characters" autocomplete="off" maxlength="6" placeholder="ABCDE1" value="${esc(qcode)}">
    <fieldset class="seg"><legend>How are you playing?</legend>
      <label><input type="radio" name="type" value="team" ${last.type !== "solo" ? "checked" : ""}><span>As a team<small>one phone for the team</small></span></label>
      <label><input type="radio" name="type" value="solo" ${last.type === "solo" ? "checked" : ""}><span>Just me<small>my own phone</small></span></label>
    </fieldset>
    <label for="name" id="nameLbl">Team name</label>
    <input id="name" maxlength="18" autocomplete="off" value="${esc(last.name || "")}">
    ${err ? `<p class="err">${esc(err)}</p>` : ""}
    <button class="btn y xl full" id="go">Join</button>
    <p class="muted small">Jamoa bo’lib bitta telefondan yoki o’zingiz alohida qo’shilishingiz mumkin.</p></div>`;
  const setLbl = () => { const team = document.querySelector('input[name=type]:checked').value === "team"; $("#nameLbl").textContent = team ? "Team name" : "Your name"; $("#name").placeholder = team ? "Samarkand" : "Aziz"; };
  document.querySelectorAll("input[name=type]").forEach(r => r.addEventListener("change", setLbl)); setLbl();
  $("#go").addEventListener("click", start);
  if (!stopWatch) stopWatch = NET.watchRooms(list => { rooms = list; drawRooms(); });
  drawRooms();
}
let stopWatch = null, rooms = [];
function drawRooms() {
  const el = $("#rooms"); if (!el) return;
  el.innerHTML = rooms.length ? rooms.map(r => `<button class="proom" data-room="${esc(r.code)}"><b>${esc(r.set || "Class game")}</b><span>${esc(r.type || "")}</span><span class="muted small">${r.phase === "lobby" ? `Waiting to start · ${r.n || 0} joined` : `Playing now · question ${(r.qi || 0) + 1} of ${r.total || "?"}`}</span><span class="pcode">${esc(r.code)}</span></button>`).join("")
    : `<p class="muted small">No games right now. Ask your teacher for the code.</p>`;
}
async function start() {
  const code = $("#code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  const name = $("#name").value.trim();
  const type = document.querySelector("input[name=type]:checked").value;
  if (!/^[A-Z]{5}[1-9]$/.test(code)) return joinForm("The code has 5 letters and 1 number, like ABCDE1.");
  if (!name) return joinForm(type === "team" ? "Write your team name." : "Write your name.");
  keep("clv-live-last", { name, type });
  if (stopWatch) { stopWatch(); stopWatch = null; }
  const prev = saved("clv-live-" + code);
  Object.assign(me, { id: prev && prev.id || Math.random().toString(36).slice(2, 10), name, type, room: code });
  keep("clv-live-" + code, { id: me.id });
  app.innerHTML = `<div class="pcard center"><p class="big2">Connecting…</p></div>`;
  try {
    client = await NET.join(code, onMsg, s => { const n = $("#net"); if (n) { n.className = "net " + s; n.textContent = s === "online" ? "Online" : "Reconnecting…"; } });
    client.subscribe(NET.topic(code, "state"));
    sendJoin();
    setTimeout(() => { if (!st) { app.innerHTML = `<div class="pcard center"><p class="big2">Looking for the game…</p><p class="muted">Check the code: <b>${esc(code)}</b></p><button class="btn" id="back">Change code</button></div>`; $("#back").addEventListener("click", () => { client.close(); joinForm(); }); } }, 7000);
  } catch (e) { joinForm("Could not connect. Check the internet and try again."); }
}
function sendJoin() { client.publish(NET.topic(me.room, "join"), { id: me.id, name: me.name, type: me.type }); }
function onMsg(topic, payload) {
  if (!payload) return;
  let s; try { s = JSON.parse(payload); } catch (e) { return; }
  st = s; gotAt = Date.now();
  if (st.players && st.phase !== "closed" && !st.players.some(p => p[0] === me.id)) sendJoin();
  if (st.phase === "question" && sentFor !== st.qi) { /* new question */ }
  update();
}
function myScore() {
  const r = (st.players || []).slice().sort((a, b) => b[1] - a[1]);
  const i = r.findIndex(p => p[0] === me.id);
  return { pos: i + 1, of: r.length, score: i >= 0 ? r[i][1] : 0 };
}
function screenKey() {
  if (!st) return "";
  const answered = sentFor === st.qi || (st.answered || []).includes(me.id);
  return [st.phase, st.qi, st.q && st.q.clue || "", st.phase === "question" ? answered : "", st.phase === "lobby" ? st.n : ""].join("|");
}
function update() {
  const k = screenKey();
  if (k === lastKey) return;
  if (st.phase === "question" && lastKey.split("|")[1] !== String(st.qi)) { myChoice = null; built = []; }
  lastKey = k;
  render();
}
function header() { return `<header class="pbar"><span class="who">${me.type === "team" ? "Team" : "Solo"} · <b>${esc(me.name)}</b></span><span id="net" class="net online">Online</span></header>`; }
function render() {
  clearInterval(tick);
  let body = "";
  const q = st.q;
  if (st.phase === "closed") body = `<div class="pcard center"><p class="big2">The game has ended.</p><p class="muted">Thanks for playing!</p><a class="btn y" href="../">Back to my lessons</a></div>`;
  else if (st.phase === "lobby") body = `<div class="pcard center"><p class="big2">You’re in!</p><p class="lead2">Look at the board. The game starts soon.</p><p class="muted">${st.n || 0} joined</p></div>`;
  else if (st.phase === "question") {
    const answered = sentFor === st.qi || (st.answered || []).includes(me.id);
    if (answered) body = `<div class="pcard center"><p class="big2">Answer sent!</p><p class="lead2">Wait for the others…</p></div>`;
    else {
      const top = `<div class="row between"><span class="eb">${st.qi + 1} / ${st.total}</span><span class="tbig" id="pt">${Math.ceil(st.left)}</span></div>`;
      if (q.type === "build") {
        body = `<div class="pq">${top}<p class="pqtext">Tap the words in order</p>
          <div class="pslots" id="slots"></div><div class="ppool" id="pool"></div>
          <button class="btn y xl full" id="sendBuild" disabled>Send</button></div>`;
      } else if (q.type === "tf") {
        body = `<div class="pq">${top}<p class="pqtext">${esc(q.text)}</p><div class="popts two">
          <button class="opt o3" data-c="0"><span class="tfmark">✓</span><span>Right</span></button>
          <button class="opt o0" data-c="1"><span class="tfmark">✗</span><span>Wrong</span></button></div></div>`;
      } else {
        body = `<div class="pq">${top}${q.type === "clue" ? `<p class="pqtext"><small>Clue</small> ${esc(q.clue)}</p>` : `<p class="pqtext">${esc(q.text)}</p>`}
          <div class="popts">${q.opts.map((t, i) => `<button class="opt o${i}" data-c="${i}">${shape(i)}<span>${esc(t)}</span></button>`).join("")}</div></div>`;
      }
    }
  } else if (st.phase === "reveal" || st.phase === "board") {
    const g = st.gained ? st.gained[me.id] : undefined, ok = g > 0, none = g === undefined;
    const { pos, of, score } = myScore();
    body = `<div class="pcard center ${none ? "" : ok ? "good" : "bad"}">
      <p class="big2">${none ? (st.phase === "board" ? "Scores" : "Time’s up!") : ok ? "Correct!" : "Not this time"}</p>
      ${ok ? `<p class="plus">+${g}</p>` : ""}
      ${st.answerText ? `<p class="lead2">Answer: <b>${esc(st.answerText)}</b></p>` : ""}
      <p class="lead2">Score <b>${score}</b> · place <b>${pos}</b> of ${of}</p></div>`;
  } else if (st.phase === "end") {
    const { pos, of, score } = myScore();
    body = `<div class="pcard center ${pos === 1 ? "good" : ""}"><p class="eb">Final result</p><p class="big2">${pos === 1 ? "You won!" : `Place ${pos} of ${of}`}</p><p class="plus">${score}</p><a class="btn y" href="../">Back to my lessons</a></div>`;
  }
  app.innerHTML = header() + body;
  if (st.phase === "question" && $("#pt")) {
    tick = setInterval(() => { const el = $("#pt"); if (!el) return clearInterval(tick); el.textContent = Math.max(0, Math.ceil(st.left - (Date.now() - gotAt) / 1000)); }, 1000);
    if (q.type === "build") drawBuild();
  }
}
function drawBuild() {
  const q = st.q;
  $("#slots").innerHTML = built.length ? built.map((k, i) => `<button class="pw on" data-out="${i}">${esc(q.words[k])}</button>`).join("") + `<span class="pw end">${q.end}</span>` : `<span class="muted">Your sentence…</span>`;
  $("#pool").innerHTML = q.words.map((w, k) => built.includes(k) ? "" : `<button class="pw" data-in="${k}">${esc(w)}</button>`).join("");
  $("#sendBuild").disabled = built.length !== q.words.length;
}
function send(data) {
  if (!st || st.phase !== "question" || sentFor === st.qi) return;
  sentFor = st.qi;
  client.publish(NET.topic(me.room, "ans"), Object.assign({ id: me.id, qi: st.qi }, data));
  try { navigator.vibrate && navigator.vibrate(25); } catch (e) {}
  update();
}
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.room) { const c = $("#code"); if (c) { c.value = b.dataset.room; document.querySelectorAll(".proom").forEach(x => x.classList.toggle("sel", x === b)); $("#name").focus(); } return; }
  if (!st) return;
  if (b.dataset.c != null) send({ choice: +b.dataset.c });
  else if (b.dataset.in != null) { built.push(+b.dataset.in); drawBuild(); }
  else if (b.dataset.out != null) { built.splice(+b.dataset.out, 1); drawBuild(); }
  else if (b.id === "sendBuild") send({ order: built.slice() });
});
joinForm();
})();
</script>
</body>
</html>
